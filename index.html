  try { localStorage.setItem('__test__','1'); localStorage.removeItem('__test__'); return localStorage; } catch(e) {}

    getItem: function(k) { return store.hasOwnProperty(k) ? store[k] : null; },
    setItem: function(k, v) { store[k] = String(v); },

  };
})();

// ── Date / scheduling helpers ─────────────────────────────────────────────────
function getWeekKeyGlobal(dateOrOffset, weekStartDay=1) {
  const d = new Date();
  if (typeof dateOrOffset === 'number') {
    d.setDate(d.getDate() + dateOrOffset * 7);
  } else if (dateOrOffset && typeof dateOrOffset === 'string') {
    const parts = dateOrOffset.split('-');
    d.setFullYear(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  }
  d.setHours(0,0,0,0);
  const dow = d.getDay();
  const daysBack = (dow - weekStartDay + 7) % 7;
  d.setDate(d.getDate() - daysBack);
  return d.toISOString().slice(0,10);
}
function getSeasonalIndex(wo, sd) {
  const d = new Date(); d.setDate(d.getDate() + wo * 7);
  const jan1 = new Date(d.getFullYear(), 0, 1);
  return Math.min(Math.max(Math.floor((d - jan1) / (7 * 24 * 60 * 60 * 1000)), 0), sd.length - 1);
}
function getSeasonal(wo, sd) { return sd[getSeasonalIndex(wo, sd)].mult; }
function r2(n) { return n ? Math.round(n * 100) / 100 : 0; }
function fmt(n) { if (!n || n === 0) return "—"; return Number(n.toFixed(2)).toString(); }
function todayStr() { return new Date().toISOString().slice(0, 10); }

function weekLabel(offset) {
  const d = new Date(); d.setDate(d.getDate() + offset * 7);
  return d.toLocaleDateString("en-CA", { month:"short", day:"numeric" });
}
function daysLabel(days) {
  const d = new Date(); d.setDate(d.getDate() + days);
  return d.toLocaleDateString("en-CA", { month:"short", day:"numeric" });
}
function dateToDayOffset(dateStr) {
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((target - today) / (24 * 60 * 60 * 1000));
}
function dateToWeekOffset(dateStr) { return dateToDayOffset(dateStr) / 7; }

// Format a date offset (in days from today) as a friendly label
function dayOffsetToLabel(dayOffset) {
  const d = new Date(); d.setDate(d.getDate() + dayOffset);
  if (dayOffset === 0) return "Today";
  if (dayOffset === -1) return "Yesterday";
  if (dayOffset === 1) return "Tomorrow";
  return d.toLocaleDateString("en-CA", { weekday:"short", month:"short", day:"numeric" });
}

function dateLabel(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString("en-CA", { month:"short", day:"numeric" });
}

// Given a deadline (date object), round back to the most recent occurrence of targetDayOfWeek
// Returns { date, dayOffset, missed } where missed=true if the day has already passed this week
function prevScheduledDay(deadlineDayOffset, targetDayOfWeek) {
  // deadlineDayOffset = days from today when we need it done by
  // We want the most recent targetDayOfWeek on or before that deadline
  const deadlineDate = new Date();
  deadlineDate.setDate(deadlineDate.getDate() + deadlineDayOffset);
  deadlineDate.setHours(0,0,0,0);

  const deadlineDow = deadlineDate.getDay(); // 0=Sun
  // How many days back to go to hit targetDayOfWeek
  let daysBack = (deadlineDow - targetDayOfWeek + 7) % 7;
  const scheduledDate = new Date(deadlineDate);
  scheduledDate.setDate(scheduledDate.getDate() - daysBack);

  const today = new Date(); today.setHours(0,0,0,0);
  const dayOffset = Math.round((scheduledDate - today) / (24 * 60 * 60 * 1000));
  const missed = dayOffset < 0;

  return {
    date: scheduledDate,
    dayOffset,
    label: dayOffsetToLabel(dayOffset),
    missed,
    dateStr: scheduledDate.toLocaleDateString("en-CA", { weekday:"short", month:"short", day:"numeric" }),
  };
}

// For Pink (exact fruit): calculate exact load date so it finishes on targetDayOffset
function exactFruitLoadDate(targetDayOffset, fruitDays) {
  const loadDayOffset = targetDayOffset - fruitDays;
  return {
    dayOffset: loadDayOffset,
    label: dayOffsetToLabel(loadDayOffset),
    missed: loadDayOffset < 0,
    dateStr: dayOffsetToLabel(loadDayOffset),
  };
}

// For regular species: find most recent fruit loading day on or before the target
function prevFruitDay(targetDayOffset, fruitDaysList) {
  // fruitDaysList = [2, 5] for Tue + Fri
  const targetDate = new Date(); targetDate.setDate(targetDate.getDate() + targetDayOffset);
  targetDate.setHours(0,0,0,0);
  const dow = targetDate.getDay();

  // Find which of the fruit days is most recent on or before target
  let bestDaysBack = 7;
  fruitDaysList.forEach(fd => {
    const daysBack = (dow - fd + 7) % 7;
    if (daysBack < bestDaysBack) bestDaysBack = daysBack;
  });

  const loadDate = new Date(targetDate);
  loadDate.setDate(loadDate.getDate() - bestDaysBack);
  const today = new Date(); today.setHours(0,0,0,0);
  const dayOffset = Math.round((loadDate - today) / (24 * 60 * 60 * 1000));

  return {
    dayOffset,
    label: dayOffsetToLabel(dayOffset),
    missed: dayOffset < 0,
    dateStr: loadDate.toLocaleDateString("en-CA", { weekday:"short", month:"short", day:"numeric" }),
  };
}

function itemHighlight(item) {
  const startOffset = dateToDayOffset(item.startDate);
  const endOffset   = item.endDate ? dateToDayOffset(item.endDate) : startOffset;
  return (startOffset - 5) <= 0 && (endOffset + 1) >= 0;
}
function itemIsLive(item) {
  if (item.type === "event") return false;
  const startOffset = dateToDayOffset(item.startDate);
  const endOffset   = item.endDate ? dateToDayOffset(item.endDate) : startOffset;
  return startOffset <= 5 && endOffset >= 0;
}
function itemIsThisWeek(item) {
  const startOffset = dateToDayOffset(item.startDate);
  const endOffset   = item.endDate ? dateToDayOffset(item.endDate) : startOffset;
  return startOffset <= 5 && endOffset >= -1;
}

  // Fetch weather for a specific city using Open-Meteo geocoding
  async function fetchWeatherForCity(city, province) {
    const cityKey = `${city},${province}`.toLowerCase().replace(/\s/g,'');
    const cached = clientWeatherCache[cityKey];
    const now = Date.now();
    if (cached && cached.fetchedAt && (now - cached.fetchedAt) < 3*60*60*1000) return cached;
    try {
      // Geocode city to coordinates
      const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&country_code=CA&count=1`);
      const geoData = await geoRes.json();
      if (!geoData.results?.length) return null;
      const { latitude, longitude } = geoData.results[0];
      // Fetch weather
      const wxRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=temperature_2m_max,precipitation_sum,precipitation_probability_max&timezone=America%2FToronto&forecast_days=16`);
      const wxData = await wxRes.json();
      const result = { ...wxData, fetchedAt: now, cityKey };
      setClientWeatherCache(p => ({ ...p, [cityKey]: result }));
      return result;
    } catch(e) { return null; }
  }

  // Fetch weather from Open-Meteo for Cambridge ON — cache 3 hours (farm default)
  function fetchWeather() {
    const cached = weatherData;

    if (cached && cached.fetchedAt && (now - cached.fetchedAt) < 3*60*60*1000) return;
    setWeatherLoading(true);
    fetch("https://api.open-meteo.com/v1/forecast?latitude=43.36&longitude=-80.31&daily=temperature_2m_max,precipitation_sum,precipitation_probability_max&timezone=America%2FToronto&forecast_days=16")
      .then(r=>r.json())
      .then(data=>{ setWeatherData({ ...data, fetchedAt: Date.now() }); setWeatherLoading(false); })
      .catch(()=>setWeatherLoading(false));
    // Also pre-fetch weather for all unique client cities
    const seen = new Set();
    clients.forEach(cl=>{
      if(!cl.city) return;
      const key = `${cl.city},${cl.province||"ON"}`.toLowerCase().replace(/\s/g,'');
      if(seen.has(key)) return;
      seen.add(key);
      const cached2 = clientWeatherCache[key];
      if(!cached2 || (now - cached2.fetchedAt) > 3*60*60*1000) {
        fetchWeatherForCity(cl.city, cl.province||"ON");
      }
    });
  }

  // Score a single day: 0 (terrible) to 1 (perfect)
  function scoreDayWeather(maxTemp, precipitation, precipProb) {
    const tempScore = maxTemp >= 22 ? 1 : maxTemp >= 18 ? 0.8 : maxTemp >= 14 ? 0.5 : maxTemp >= 8 ? 0.2 : 0;
    const rainScore = (precipitation||0) < 2 && (precipProb||0) < 30 ? 1 : (precipitation||0) < 5 && (precipProb||0) < 50 ? 0.5 : 0.1;
    return r2(tempScore * 0.6 + rainScore * 0.4);
  }

  // Get weather scores for next 16 days

    if (!weatherData?.daily || schedule.weatherEnabled===false) return [];
    const { time, temperature_2m_max, precipitation_sum, precipitation_probability_max } = weatherData.daily;
    return time.map((date, i) => ({
      date,
      score: scoreDayWeather(temperature_2m_max[i], precipitation_sum[i], precipitation_probability_max[i]),
      temp: Math.round(temperature_2m_max[i]),
      precip: precipitation_sum[i],
    }));
  }, [weatherData]);

  // Get weekend score for a given week offset (0=this week, 1=next week etc.)
  function getWeekendScore(weekOffset=0) {
    if (!weatherScores.length) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const scores = weatherScores.filter(w=>{
      const d = new Date(w.date+'T12:00:00');
      const dow = d.getDay();
      if(dow !== 0 && dow !== 6) return false; // weekends only
      const daysAhead = Math.round((d-today)/(24*60*60*1000));
      return daysAhead >= weekOffset*7 && daysAhead < (weekOffset+1)*7+7;
    });
    if(!scores.length) return null;
    return r2(scores.reduce((s,w)=>s+w.score,0)/scores.length);
  }

  // Get effective weather sensitivity for a client
  function getWeatherSensitivity(cl) {
    if (!cl) return 0;
    if (cl.weatherSensitivity === "manual") return cl.weatherSensitivityManual ?? 0.15;
    // Auto mode — use calculated correlation if enough data, else use defaults
    const defaultSensitivity = cl.clientType === "market" ? 1.0 : cl.clientType === "store" ? 0.3 : cl.touristLocation ? 0.45 : 0.15;
    // TODO: calculate from history correlation when enough data exists
    return defaultSensitivity;
  }

  // Get weather nudge multiplier for a client at a given week offset
  // Get weather scores for a specific client (uses their city if set, else farm default)
  function getClientWeatherScores(cl) {
    if (cl?.city) {
      const cityKey = `${cl.city},${cl.province||"ON"}`.toLowerCase().replace(/\s/g,'');
      const cached = clientWeatherCache[cityKey];
      if (cached?.daily) {
        const { time, temperature_2m_max, precipitation_sum, precipitation_probability_max } = cached.daily;
        return time.map((date, i) => ({
          date,
          score: scoreDayWeather(temperature_2m_max[i], precipitation_sum[i], precipitation_probability_max[i]),
          temp: Math.round(temperature_2m_max[i]),
        }));
      }
    }
    return weatherScores; // fallback to farm weather
  }

  // Day weights — how much weather on each day affects demand
  const DAY_WEIGHTS = {0:1.0, 6:1.0, 5:0.8, 4:0.5, 1:0.2, 2:0.2, 3:0.2}; // Sun,Sat,Fri,Thu,Mon,Tue,Wed

  function getClientWeekendScore(cl, weekOffset=0) {
    const scores = getClientWeatherScores(cl);
    if (!scores.length) return null;
    const today = new Date(); today.setHours(0,0,0,0);

    // Get operating days for this client
    // Markets use their specific market day; others use operatingDays or default all days
    let opDays;
    if(cl.clientType==='market') {
      opDays = new Set([cl.marketDay??6]);
    } else if(cl.operatingDays && cl.operatingDays.length>0) {
      opDays = new Set(cl.operatingDays);
    } else {
      // Default: all days open
      opDays = new Set([0,1,2,3,4,5,6]);
    }

    // Filter to days within this week window that client operates
    // For near-term offsets use exact window; for far offsets use whatever is available in forecast
    const targetStart = weekOffset * 7;
    const targetEnd = Math.min((weekOffset + 1) * 7, 16); // cap at 16-day forecast
    const wkScores = scores.filter(w=>{
      const d = new Date(w.date+'T12:00:00');
      const dow = d.getDay();
      if(!opDays.has(dow)) return false;
      const daysAhead = Math.round((d-today)/(24*60*60*1000));
      return daysAhead >= targetStart && daysAhead < targetEnd + 7;
    });

    if(!wkScores.length) return null;

    // Weighted average — weekend days count more
    let weightedSum = 0, totalWeight = 0;
    wkScores.forEach(w=>{
      const d = new Date(w.date+'T12:00:00');
      const dow = d.getDay();
      const weight = DAY_WEIGHTS[dow]||0.2;
      weightedSum += w.score * weight;
      totalWeight += weight;
    });
    return totalWeight > 0 ? r2(weightedSum / totalWeight) : null;
  }

  function getWeatherNudge(cl, weekOffset) {
    if (schedule.weatherEnabled===false) return 1.0;
    const sensitivity = getWeatherSensitivity(cl);
    if (sensitivity === 0) return 1.0;
    const score = getClientWeekendScore(cl, weekOffset);
    if (score === null) return 1.0;
    // Compare weather score against seasonal norm for this week
    // Seasonal multiplier tells us what "normal" demand is for this time of year
    // A score of 0.5 = average weather. We scale the "average" expectation by season.
    // In summer (mult=1.3), average weather is already good — only exceptional weather nudges up
    // In winter (mult=0.5), average weather is already bad — only exceptional weather nudges down
    const seasonalMult = getSeasonal(weekOffset, seasonal);
    // Normalise seasonal multiplier to a 0-1 weather expectation scale
    // mult 1.0 = 0.5 weather expectation, mult 1.4 = 0.7 expectation, mult 0.5 = 0.25 expectation
    const seasonalWeatherBaseline = Math.min(0.85, Math.max(0.15, seasonalMult * 0.5));
    // Nudge only when weather deviates from seasonal expectation
    const nudge = 1 + (score - seasonalWeatherBaseline) * sensitivity;
    return Math.max(0.5, Math.min(1.5, r2(nudge)));
  }

  // ── Room occupancy calculations ──────────────────────────────────────────

  // Calculate incubation and fruiting room occupancy for a given day offset
  function getRoomOccupancy(dayOffset=0) {
    const targetDate = new Date(); targetDate.setHours(0,0,0,0);
    targetDate.setDate(targetDate.getDate() + dayOffset);
    let incubation = 0, fruiting = 0;
    tracker.filter(e=>e.type==='block'&&e.entryClass!=='loss'&&e.entryClass!=='consumed').forEach(e=>{
      const sp = species.find(s=>s.id===(e.speciesId||e.sid));
      if(!sp) return;
      const qty = parseFloat(e.qty)||0;
      if(qty<=0) return;
      const inocDate = new Date(e.date+'T12:00:00');
      const incubDays = getBlockIncubDays(sp);
      const fruitStart = new Date(inocDate); fruitStart.setDate(inocDate.getDate()+incubDays);
      const fruitEnd = new Date(fruitStart); fruitEnd.setDate(fruitStart.getDate()+sp.fruitDays);
      const daysFromInoc = Math.round((targetDate-inocDate)/(24*60*60*1000));
      const daysFromFruitStart = Math.round((targetDate-fruitStart)/(24*60*60*1000));
      if(daysFromInoc>=0 && daysFromFruitStart<0) incubation+=qty; // in incubation
      else if(daysFromFruitStart>=0 && targetDate<fruitEnd) fruiting+=qty; // in fruiting room
    });
    return { incubation: Math.round(incubation), fruiting: Math.round(fruiting) };
  }

  // Find the day offset when the shortest-lead batch currently in incubation will hit fruiting room
  const shortestBatchOffset = useMemo(()=>{
    let minDays = null;
    tracker.filter(e=>e.type==='block'&&e.entryClass!=='loss'&&e.entryClass!=='consumed').forEach(e=>{

      const today = new Date(); today.setHours(0,0,0,0);
      const daysUntilFruit = Math.round((fruitStart-today)/(24*60*60*1000));
      if(daysUntilFruit>0 && (minDays===null||daysUntilFruit<minDays)) minDays=daysUntilFruit;
    });
    return minDays;
  },[tracker,species]);

  const thisWeek = useMemo(()=>species.map(sp=>{
    // Use seasonally-normalized baseline from history, fall back to current orders
    let rawLbs=0;
    clients.forEach(cl=>{rawLbs+=parseFloat(orders[cl.id]?.[sp.id]??0)||0;});
    liveItems.forEach(item=>{rawLbs+=parseFloat(item.orders?.[sp.id]??0)||0;});

    // Baseline = normalized average of last 8 weeks per client, weather-nudged at harvest week
    let baselineLbs=0;
    clients.forEach(cl=>{
      const base = getBaselineLbs(cl.id, sp.id);
      const blockHarvestOffset = Math.round((getBlockIncubDays(sp) + sp.fruitDays) / 7);
      const nudge = getWeatherNudge(cl, blockHarvestOffset);
      baselineLbs += base * nudge;
    });

    // Only add upcoming items to baseline if they start soon enough for regular orders
    // Items are already filtered to "live" (start within 5 days) by liveItems
    liveItems.forEach(item=>{baselineLbs+=parseFloat(item.orders?.[sp.id]??0)||0;});

    const todayLbs = baselineLbs > 0 ? baselineLbs : rawLbs;
    if(todayLbs===0&&!Object.values(extraDemand).some(w=>w[sp.id]))return{...sp,todayLbs:rawLbs,totalToday:0};

    const todayMult=getSeasonal(0,seasonal);
    const projRegular=(wo)=>todayLbs>0?r2(todayLbs*(getSeasonal(wo,seasonal)/todayMult)):0;
    const extraAt=(wo)=>extraDemand[wo]?.[sp.id]||0;

    // Per-step upcoming item demand — only include if market starts in time for that step
    const spawnPipelineDays = sp.spawnDays + getBlockIncubDays(sp) + sp.fruitDays;
    const blockPipelineDays = getBlockIncubDays(sp) + sp.fruitDays;
    const fruitPipelineDays = sp.fruitDays;

    // Per-step upcoming demand with proper start/end date rules
    // For ongoing clients/markets: include when start is within pipeline, exclude when end is too close
    // For events: one-time demand only in the specific week they fall
    const upcomingLbsForStep = (pipelineDays, weekOffset=0) => {
      let lbs = 0;
      sortedUpcoming.forEach(item=>{
        const itemLbs = parseFloat(item.orders?.[sp.id]??0)||0;
        if(!itemLbs) return;
        const daysUntilStart = dateToDayOffset(item.startDate);
        const daysUntilEnd = item.endDate ? dateToDayOffset(item.endDate) : Infinity;

        if(item.type==='event') {
          // One-time event: only count in the week it falls
          const eventWeekOffset = Math.round(daysUntilStart / 7);
          if(Math.abs(eventWeekOffset - weekOffset) <= 0.5) lbs += itemLbs;
        } else {
          // Ongoing client/market:
          // Start rule: only include if start date is within this pipeline's lead time
          const startOk = daysUntilStart <= pipelineDays;
          // End rule: only include if enough time remains to complete this pipeline step
          const endOk = daysUntilEnd >= pipelineDays;
          if(startOk && endOk) lbs += itemLbs;
        }
      });
      return lbs;
    };

    // Regular client lbs — use history baseline (todayLbs) with seasonal scaling
    // Weather nudge applied per client at the given week offset
    const regularMult = getSeasonal(0,seasonal);

    // Per-client weather-nudged projection at a given week offset
    const projRegularOnly=(wo)=>{
      let lbs = 0;
      clients.forEach(cl=>{
        const base = getBaselineLbs(cl.id, sp.id);
        if(!base) return;
        const seasonAdj = r2(base * (getSeasonal(wo,seasonal)/regularMult));
        const nudge = getWeatherNudge(cl, Math.round(wo));
        lbs += r2(seasonAdj * nudge);
      });
      return r2(lbs);
    };

    const totalAt=(wo, upcomingLbs=0)=>r2(projRegularOnly(wo) + r2(upcomingLbs*(getSeasonal(wo,seasonal)/regularMult)) + extraAt(wo));

    const spawnUpLbs = upcomingLbsForStep(spawnPipelineDays, sp.spawnWeeks);
    const blockUpLbs = upcomingLbsForStep(blockPipelineDays, sp.blockWeeks);
    const fruitUpLbs = upcomingLbsForStep(fruitPipelineDays, Math.round(sp.fruitDays/7));

    // Spawn lead: look at demand at HARVEST time (full pipeline = spawn + block + fruit)
    const spawnDeliveryDays = sp.spawnDays;
    const spawnHarvestWeeks = Math.round(spawnPipelineDays / 7);
    const spawnScheduled = prevScheduledDay(spawnDeliveryDays, schedule.spawnDay);
    // Per-week demand at each harvest slot (not cumulative)
    const spawnLbs  = totalAt(spawnHarvestWeeks,   spawnUpLbs);
    const spawnLbs2 = totalAt(spawnHarvestWeeks+1, spawnUpLbs);
    const spawnLbs3 = totalAt(spawnHarvestWeeks+2, spawnUpLbs);

    // Block lead: look at demand at HARVEST time (incub + fruit pipeline)
    // blockHarvestWeeks = how many weeks until blocks made TODAY will be harvested
    const blockDeliveryDays = getBlockIncubDays(sp);
    const blockHarvestWeeks = Math.round(blockPipelineDays / 7);
    const blockScheduled = prevScheduledDay(blockDeliveryDays, schedule.blockDay);

    // projectedLbs = demand at the week THIS week's batch will be harvested
    // lbsPerBlock = blockDivisor (e.g. 2 lbs per block for Black)
    // blocks1 = projectedLbs / lbsPerBlock  (what you need to make this week)
    // blocks2 = blocks1 + demand one week AFTER harvest / lbsPerBlock
    // blocks3 = blocks2 + demand two weeks AFTER harvest / lbsPerBlock
    const blockLbs  = totalAt(blockHarvestWeeks,   blockUpLbs); // projected lbs at harvest week
    const blockLbs2 = totalAt(blockHarvestWeeks+1, blockUpLbs); // projected lbs one week later
    const blockLbs3 = totalAt(blockHarvestWeeks+2, blockUpLbs); // projected lbs two weeks later

    // blocks1/2/3 are per-week block needs, NOT cumulative
    const blocks1 = r2(blockLbs  / sp.blockDivisor);
    const blocks2 = r2(blockLbs2 / sp.blockDivisor);
    const blocks3 = r2(blockLbs3 / sp.blockDivisor);

    // Fruit load date
    const fruitTargetDays = sp.fruitDays;
    const harvestDayOffset = 0;
    const fruitLoadTarget = -sp.fruitDays + sp.fruitDays;
    const fruitDeadlineDayOffset = sp.fruitDays;
    let fruitScheduled;
    if(sp.exactFruit){
      fruitScheduled = exactFruitLoadDate(fruitDeadlineDayOffset, sp.fruitDays);
    } else {
      fruitScheduled = prevFruitDay(fruitDeadlineDayOffset, schedule.fruitDays);
    }
    // Fruit loading uses harvest week weather — when will these blocks actually be sold
    // For 11-day species harvest week = ~1.5 weeks, for 21-day = ~3 weeks
    // But weather forecast only covers 16 days so cap at week 2
    const fruitWeatherOffset = Math.min(2, Math.round(sp.fruitDays/7));
    const fruitLbs = (()=>{
      let lbs = 0;
      clients.forEach(cl=>{
        const base = getBaselineLbs(cl.id, sp.id);
        if(!base) return;
        const seasonAdj = r2(base * (getSeasonal(fruitWeatherOffset,seasonal)/regularMult));
        const nudge = getWeatherNudge(cl, fruitWeatherOffset);
        lbs += r2(seasonAdj * nudge);
      });
      return r2(lbs + r2(fruitUpLbs*(getSeasonal(fruitWeatherOffset,seasonal)/regularMult)) + extraAt(fruitWeatherOffset));
    })();

    const spawnBags1=r2((spawnLbs /sp.blockDivisor)/getSpawnBagBlocks(sp));
    const spawnBags2=r2((spawnLbs2/sp.blockDivisor)/getSpawnBagBlocks(sp));
    const spawnBags3=r2((spawnLbs3/sp.blockDivisor)/getSpawnBagBlocks(sp));
    const fruitBlocks=r2(fruitLbs/sp.blockDivisor);
    const hasUpcoming=spawnLbs>projRegular(sp.spawnWeeks)||blockLbs>projRegular(sp.blockWeeks);

    // Harvest target label (what week the spawn/blocks will yield)
    const spawnHarvestLabel = daysLabel(sp.spawnWeeks*7);
    const blockHarvestLabel = daysLabel(sp.blockWeeks*7);
    const fruitHarvestLabel = daysLabel(sp.fruitDays);

    return{
      ...sp,todayLbs,totalToday:todayLbs,hasUpcoming,
      spawnLbs,spawnLbs2,spawnLbs3,spawnBags1,spawnBags2,spawnBags3,
      spawnScheduled, spawnHarvestLabel,
      blockLbs,blockLbs2,blockLbs3,blocks1,blocks2,blocks3,
      blockScheduled, blockHarvestLabel,
      fruitLbs,fruitBlocks,fruitScheduled,fruitHarvestLabel,
      weeklyBlocks:blocks1,weeklySpawnBags:spawnBags1,
    };
  }),[orders,species,clients,seasonal,extraDemand,liveItems,schedule,sortedUpcoming]);

  const coverageWeeks = useMemo(()=>{
    const cov = {};
    // blockByWeek[w] = lbs of inventory harvesting in that week relative to today's blocks:
    //   w=0 → same harvest week as blocks made today (harvest week)
    //   w=1 → harvest week + 1
    //   w=2 → harvest week + 2
    species.forEach(sp => { cov[sp.id] = { blockByWeek:[0,0,0], spawnByWeek:[0,0,0] }; });

    const today = new Date(); today.setHours(0,0,0,0);

    tracker.filter(e => !e.entryClass && (e.qty||0)>0 && (e.type==='block'||e.type==='spawn'))
    .forEach(entry => {
      const sp = species.find(s => s.id === (entry.speciesId||entry.sid));
      if(!sp) return;
      const qty = parseFloat(entry.qty)||0;
      const inocDate = new Date(entry.date+'T12:00:00');
      const daysFromToday = Math.round((inocDate - today) / (24*60*60*1000));

      if(entry.type==='block') {
        const incubDays = getBlockIncubDays(sp);
        // How many days until this batch is harvested
        const harvestDays = daysFromToday + incubDays + sp.fruitDays;
        // Reference: blocks made TODAY harvest in (incubDays + fruitDays) days
        const refDays = incubDays + sp.fruitDays;
        // Which harvest week does this batch land in, relative to today's blocks?
        const week = Math.round((harvestDays - refDays) / 7);
        // Only weeks 0, 1, 2 matter — earlier harvests too soon, later too far out
        if(week < 0 || week > 2) return;
        cov[sp.id].blockByWeek[week] = r2(cov[sp.id].blockByWeek[week] + r2(qty * sp.blockDivisor));

      } else if(entry.type==='spawn') {
        const spawnDays = sp.spawnDays ?? (sp.spawnWeeks * 7);
        const incubDays = getBlockIncubDays(sp);
        const harvestDays = daysFromToday + spawnDays + incubDays + sp.fruitDays;
        const refDays = spawnDays + incubDays + sp.fruitDays;
        const week = Math.round((harvestDays - refDays) / 7);
        if(week < 0 || week > 2) return;
        cov[sp.id].spawnByWeek[week] = r2(cov[sp.id].spawnByWeek[week] + r2(qty * getSpawnBagBlocks(sp) * sp.blockDivisor));
      }
    });
    return cov;
  },[tracker,species,schedule]);

  function applyOffset(lbs1, lbs2, lbs3, byWeek) {
    // lbs1/2/3 = projected lbs demand for harvest week, harvest week+1, harvest week+2
    // byWeek[w] = lbs of inventory harvesting that week
    // Only surplus (inventory > demand for that week) carries forward to reduce next week's target
    // A shortage never affects other weeks — can't fix it with today's blocks
    let carry = 0;
    const remainLbs = [lbs1, lbs2, lbs3];
    for(let w = 0; w <= 2; w++) {
      const available = r2((byWeek[w]||0) + carry);
      const demand = remainLbs[w]||0;
      if(available > demand) {
        remainLbs[w] = 0;
        carry = r2(available - demand); // only the surplus carries forward
      } else {
        remainLbs[w] = r2(demand - available);
        carry = 0; // shortage or exact match — nothing carries forward
      }
    }
    return remainLbs; // caller divides by blockDivisor to get blocks
  }

  const activeSpecies = useMemo(()=>{
    // Calculate how many blocks are being substituted into/out of fruiting room per species
    // Only count substitutions where the from-species blocks are ready to fruit
    const fruitSubIn = {};  // extra fruiting room loading needed for destination species
    const fruitSubOut = {}; // fruiting room loading removed from source species

    substitutions.forEach(sub => {
      const fromSp = species.find(s=>s.id===sub.fromSpeciesId);
      const toSp = species.find(s=>s.id===sub.toSpeciesId);
      if(!fromSp||!toSp) return;
      // Check if blocks are ready — use tracker entry if available, otherwise use sub date
      const entry = (tracker||[]).find(e=>e.id===sub.trackerEntryId);
      let isReady = false;
      if(entry) {
        const daysOld = -dateToDayOffset(entry.date);
        isReady = daysOld >= getBlockIncubDays(fromSp);
      } else {
        // No tracker entry — use the substitution date itself
        const daysOld = -dateToDayOffset(sub.date);
        isReady = daysOld >= getBlockIncubDays(fromSp);
      }
      if(!isReady) return;
      fruitSubOut[sub.toSpeciesId] = r2((fruitSubOut[sub.toSpeciesId]||0) + sub.qty);
      fruitSubIn[sub.fromSpeciesId] = r2((fruitSubIn[sub.fromSpeciesId]||0) + sub.qty);
    });

    return thisWeek
      .filter(sp=>sp.totalToday>0||sp.todayLbs>0)
      .map(sp=>{
        const cov = coverageWeeks[sp.id]||{blockByWeek:[0,0,0],spawnByWeek:[0,0,0]};

        // applyOffset returns per-week remaining lbs for each harvest week
        // Display values are cumulative: 2wk = total to make to be covered for 2 weeks ahead
        const [bl1,bl2,bl3] = applyOffset(sp.blockLbs, sp.blockLbs2, sp.blockLbs3, cov.blockByWeek);
        const bk1 = r2(bl1 / sp.blockDivisor);
        const bk2 = r2((bl1 + bl2) / sp.blockDivisor);
        const bk3 = r2((bl1 + bl2 + bl3) / sp.blockDivisor);

        const [sl1,sl2,sl3] = applyOffset(sp.spawnLbs, sp.spawnLbs2, sp.spawnLbs3, cov.spawnByWeek);
        const sb1 = r2((sl1 / sp.blockDivisor) / getSpawnBagBlocks(sp));
        const sb2 = r2(((sl1 + sl2) / sp.blockDivisor) / getSpawnBagBlocks(sp));
        const sb3 = r2(((sl1 + sl2 + sl3) / sp.blockDivisor) / getSpawnBagBlocks(sp));
        const fruitLoadedAmt = getFruitLoaded(sp.id);
        // Adjust fruiting room loading by substitutions only — don't subtract already loaded
        // The target always reflects full weekly demand; fruitLoadedAmt shown as progress
        const subIn = fruitSubIn[sp.id]||0;
        const subOut = fruitSubOut[sp.id]||0;
        const fruitTarget = r2(Math.max(0,(sp.fruitBlocks||0)));
        const fruitRemain = r2(Math.max(0, fruitTarget - fruitLoadedAmt - subOut + subIn));
        const hasFruitSub = subIn > 0 || subOut > 0;
        return{...sp,
          spawnBags1:sb1, spawnBags2:sb2, spawnBags3:sb3,
          blocks1:bk1, blocks2:bk2, blocks3:bk3,
          fruitBlocks:fruitRemain,
          fruitSubIn:subIn, fruitSubOut:subOut, hasFruitSub,
        };
      });
  },[thisWeek,coverageWeeks,fruitLoaded,schedule,substitutions,tracker,species]);

  // ── Full capacity simulation — projects room occupancy including planned inoculations ──
  const capacitySimulation = useMemo(()=>{
    const incubCap = schedule.incubationCapacity||200;
    const fruitCap = schedule.fruitingCapacity||60;
    const today = new Date(); today.setHours(0,0,0,0);
    const weeks = 12;
    const days = weeks * 7;

    const incubOcc = new Array(days+1).fill(0);
    const fruitOcc = new Array(days+1).fill(0);

    // 1. Existing tracker batches
    tracker.filter(e=>e.type==='block'&&e.entryClass!=='loss'&&e.entryClass!=='consumed'&&(e.qty||0)>0).forEach(e=>{
      const sp = species.find(s=>s.id===(e.speciesId||e.sid));
      if(!sp) return;
      const qty = parseFloat(e.qty)||0;
      const inocDate = new Date(e.date+'T12:00:00');
      const blkIncub = getBlockIncubDays(sp);
      const fruitD = sp.fruitDays||11;
      for(let d=0; d<=days; d++) {
        const checkDate = new Date(today); checkDate.setDate(today.getDate()+d);
        const daysFromInoc = Math.round((checkDate-inocDate)/(24*60*60*1000));
        if(daysFromInoc>=0 && daysFromInoc<blkIncub) incubOcc[d]+=qty;
        else if(daysFromInoc>=blkIncub && daysFromInoc<blkIncub+fruitD) fruitOcc[d]+=qty;
      }
    });

    // 2. Planned future inoculations from Tasks 1wk targets
    thisWeek.forEach(sp=>{
      const blocksPerWeek = sp.blocks1||0;
      if(blocksPerWeek<=0) return;
      const blkIncub = getBlockIncubDays(sp);
      const fruitD = sp.fruitDays||11;
      for(let w=0; w<weeks; w++) {
        const inocDay = w*7;
        for(let d=inocDay; d<=days; d++) {
          const daysFromInoc = d - inocDay;
          if(daysFromInoc>=0 && daysFromInoc<blkIncub) incubOcc[d]+=blocksPerWeek;
          else if(daysFromInoc>=blkIncub && daysFromInoc<blkIncub+fruitD) fruitOcc[d]+=blocksPerWeek;
        }
      }
    });

    // 3. Build week-by-week summary
    const weekData = [];
    let firstIncubFull=null, firstFruitFull=null;
    for(let w=0; w<=weeks; w++) {
      const d = Math.min(w*7, days);
      const incub = Math.round(incubOcc[d]);
      const fruit = Math.round(fruitOcc[d]);
      const date = new Date(today); date.setDate(today.getDate()+d);
      const label = date.toLocaleDateString("en-CA",{month:"short",day:"numeric"});
      const incubPct = Math.round((incub/incubCap)*100);
      const fruitPct = Math.round((fruit/fruitCap)*100);
      if(firstIncubFull===null && incub>=incubCap) firstIncubFull=w;
      if(firstFruitFull===null && fruit>=fruitCap) firstFruitFull=w;
      weekData.push({w,label,incub,fruit,incubPct,fruitPct,incubOver:incub>incubCap,fruitOver:fruit>fruitCap});
    }
    return {weekData,firstIncubFull,firstFruitFull,incubCap,fruitCap};
  },[tracker,species,thisWeek,schedule]);

  // Bank: 3 weeks
  const bank = useMemo(()=>{
    const todayMult=getSeasonal(0,seasonal);
    const trackerCoverage={};
    tracker.forEach(entry=>{
      const sp=species.find(s=>s.id===(entry.speciesId||entry.sid));
      const tw=thisWeek.find(s=>s.id===(entry.speciesId||entry.sid));
      if(!sp||!tw)return;
      const rate=entry.type==="spawn"?tw.weeklySpawnBags:tw.weeklyBlocks;
      if(!rate)return;
      const weeksCovered=entry.qty/rate;
      const startWeek=Math.round(dateToWeekOffset(entry.date));
      for(let i=0;i<Math.ceil(weeksCovered);i++){
        const w=startWeek+i;
        const coverage=Math.min(1,weeksCovered-i);
        if(!trackerCoverage[sp.id])trackerCoverage[sp.id]={};
        if(!trackerCoverage[sp.id][w])trackerCoverage[sp.id][w]={blocks:0,spawn:0};
        if(entry.type==="block")trackerCoverage[sp.id][w].blocks+=r2(coverage*rate);
        else trackerCoverage[sp.id][w].spawn+=r2(coverage*rate);
      }
    });
    return Array.from({length:BANK_WEEKS},(_,w)=>{
      const weekData={week:w,label:weekLabel(w),species:{}};
      species.forEach(sp=>{
        let todayLbs=0;
        clients.forEach(cl=>{todayLbs+=parseFloat(orders[cl.id]?.[sp.id]??0)||0;});
        liveItems.forEach(item=>{todayLbs+=parseFloat(item.orders?.[sp.id]??0)||0;});
        const projLbs=todayLbs>0?r2(todayLbs*(getSeasonal(w,seasonal)/todayMult)):0;
        const extraLbs=extraDemand[w]?.[sp.id]||0;
        const totalLbs=r2(projLbs+extraLbs);
        if(totalLbs===0&&!trackerCoverage[sp.id]?.[w])return;
        const neededBlocks=r2(totalLbs/sp.blockDivisor);
        const neededSpawn=r2((totalLbs/sp.blockDivisor)/getSpawnBagBlocks(sp));
        const haveBlocks=r2(trackerCoverage[sp.id]?.[w]?.blocks||0);
        const haveSpawn=r2(trackerCoverage[sp.id]?.[w]?.spawn||0);
        weekData.species[sp.id]={
          totalLbs,neededBlocks,neededSpawn,haveBlocks,haveSpawn,
          blockBalance:r2(haveBlocks-neededBlocks),
          spawnBalance:r2(haveSpawn-neededSpawn),
          hasUpcoming:extraLbs>0,
        };
      });
      return weekData;
    });
  },[orders,species,clients,seasonal,tracker,extraDemand,thisWeek,liveItems]);

  // ── Simple Bank: blocks/spawn in hand vs needed this week ─────────────────
  const simplBank = useMemo(()=>{
    const result = {};
    species.forEach(sp => {
      let todayLbs = 0;
      clients.forEach(cl => { todayLbs += parseFloat(orders[cl.id]?.[sp.id]??0)||0; });
      liveItems.forEach(item => { todayLbs += parseFloat(item.orders?.[sp.id]??0)||0; });
      const weeklyBlocks = todayLbs > 0 ? r2(todayLbs / sp.blockDivisor) : 0;
      const weeklySpawn  = r2(weeklyBlocks / getSpawnBagBlocks(sp));

      // Split inventory into ready vs incubating
      let inHandBlocks = 0, inHandSpawn = 0;
      let incubatingBlocks = 0, incubatingSpawn = 0;
      const spawnDays = sp.spawnDays ?? (sp.spawnWeeks * 7);
      const blockIncubDays = getBlockIncubDays(sp);
      tracker.filter(e => (e.speciesId||e.sid) === sp.id && e.entryClass !== 'loss').forEach(e => {
        if(e.entryClass === 'consumed') {
          inHandSpawn = r2(Math.max(0, inHandSpawn + e.qty));
          return;
        }
        const daysOld = -dateToDayOffset(e.date);
        if(e.type==="block") {
          if(daysOld >= blockIncubDays) inHandBlocks = r2(inHandBlocks + e.qty);
          else incubatingBlocks = r2(incubatingBlocks + e.qty);
        } else {
          if(daysOld >= spawnDays) inHandSpawn = r2(inHandSpawn + e.qty);
          else incubatingSpawn = r2(incubatingSpawn + e.qty);
        }
      });

      // Subtract losses
      losses.filter(l => (l.speciesId||l.sid) === sp.id).forEach(l => {
        const harvDays = sp.blockWeeks * 7 - Math.abs(dateToDayOffset(l.inoculationDate));
        if(harvDays > 0) { // loss hasn't harvested yet — still relevant
          if(l.type==="block") inHandBlocks = r2(Math.max(0, inHandBlocks - l.qty));
          else inHandSpawn = r2(Math.max(0, inHandSpawn - l.qty));
        }
      });

      // Surplus = ready inventory vs weekly need (honest — only what can be used now)
      const surplusBlocks = r2(inHandBlocks - weeklyBlocks);
      const surplusSpawn  = r2(inHandSpawn  - weeklySpawn);
      // Total owned (ready + incubating) for reference
      const totalBlocks = r2(inHandBlocks + incubatingBlocks);
      const totalSpawn  = r2(inHandSpawn  + incubatingSpawn);

      result[sp.id] = {
        sp, weeklyBlocks, weeklySpawn,
        inHandBlocks, inHandSpawn,
        incubatingBlocks, incubatingSpawn,
        totalBlocks, totalSpawn,
        surplusBlocks, surplusSpawn,
        hasData: totalBlocks > 0 || totalSpawn > 0 || weeklyBlocks > 0,
      };
    });
    return result;
  },[species,orders,clients,liveItems,tracker,losses,seasonal]);

  // ── Loss warnings ──────────────────────────────────────────────────────────
  const lossWarnings = useMemo(()=>{
    return losses.map(loss => {
      const sp = species.find(s => s.id === (loss.speciesId||loss.sid));
      if(!sp) return null;
      const daysAgo = -dateToDayOffset(loss.inoculationDate);
      const weeksAgo = daysAgo / 7;
      const weeksRemaining = loss.type==="block"
        ? Math.max(0, sp.blockWeeks - weeksAgo)
        : Math.max(0, sp.spawnWeeks - weeksAgo);
      const harvestWeekOffset = weeksRemaining;
      const harvestLabel = weekLabel(Math.round(harvestWeekOffset));
      const lbsShort = r2(loss.qty * sp.blockDivisor);

      // Which species can still be started in time?
      const substitutes = species
        .filter(sub => sub.blockWeeks <= weeksRemaining && sub.id !== sp.id)
        .sort((a,b) => a.blockWeeks - b.blockWeeks)
        .map(sub => {
          const blocksNeeded = r2(lbsShort / sub.blockDivisor);
          const spawnNeeded  = r2(blocksNeeded / getSpawnBagBlocks(sub));
          const bankData = simplBank[sub.id];
          const alreadyHave = bankData?.inHandBlocks || 0;
          return { sub, blocksNeeded, spawnNeeded, alreadyHave, canCover: alreadyHave >= blocksNeeded };
        });

      // What's in the bank right now that could substitute?
      const bankOptions = species
        .filter(sub => sub.id !== sp.id)
        .map(sub => ({ sub, inHand: simplBank[sub.id]?.inHandBlocks || 0 }))
        .filter(x => x.inHand > 0)
        .sort((a,b) => b.inHand - a.inHand);

      const canStillGrow = substitutes.length > 0;
      const weeksLeft = Math.round(weeksRemaining * 10) / 10;

      return { loss, sp, harvestLabel, lbsShort, weeksLeft, substitutes, bankOptions, canStillGrow };
    }).filter(Boolean);
  },[losses, species, simplBank]);

  const graphData=useMemo(()=>{
    const todayMult=getSeasonal(0,seasonal);
    return Array.from({length:20},(_,w)=>{
      const entry={week:w,label:weekLabel(w)};
      let totalLbs=0;
      clients.forEach(cl=>{
        let clientTotal=0;
        species.forEach(sp=>{clientTotal+=parseFloat(orders[cl.id]?.[sp.id]??0)||0;});
        if(clientTotal>0){
          const seasonMult=getSeasonal(w,seasonal)/todayMult;
          const weatherMult=getWeatherNudge(cl,w);
          const proj=r2(clientTotal*seasonMult*weatherMult);
          entry[cl.name]=proj;
          totalLbs+=proj;
        }
      });
      liveItems.forEach(item=>{
        let itemTotal=0;
        species.forEach(sp=>{itemTotal+=parseFloat(item.orders?.[sp.id]??0)||0;});
        if(itemTotal>0){totalLbs+=itemTotal;}
      });
      if(totalLbs>0) entry["Total"]=r2(totalLbs);
      return entry;
    });
  },[orders,species,clients,seasonal,extraDemand,liveItems,weatherScores,clientWeatherCache]);

  // Weather nudge breakdown per week per client
  const nudgeData = useMemo(()=>{
    const todayMult = getSeasonal(0, seasonal);
    return Array.from({length:20},(_,w)=>{
      const label = weekLabel(w);
      const seasonMult = getSeasonal(w, seasonal)/todayMult;
      const seasonalBaseline = getSeasonal(w, seasonal);
      const clientNudges = clients.map(cl=>{
        let base = 0;
        species.forEach(sp=>{base += parseFloat(orders[cl.id]?.[sp.id]??0)||0;});
        if(base === 0) return null;
        const weatherMult = getWeatherNudge(cl, w);
        const withSeason = r2(base * seasonMult);
        const withWeather = r2(base * seasonMult * weatherMult);
        const nudgeLbs = r2(withWeather - withSeason);
        const nudgePct = Math.round((weatherMult - 1) * 100);
        return { name: cl.name, weatherMult, nudgeLbs, nudgePct, withSeason, withWeather };
      }).filter(Boolean);
      return { w, label, seasonMult: r2(seasonMult), seasonalBaseline: r2(seasonalBaseline), clientNudges };
    });
  },[orders,species,clients,seasonal,weatherScores,clientWeatherCache]);

  // ── Styles ────────────────────────────────────────────────────────────────
  const S={
    page:{minHeight:"100vh",background:"#0c160c",color:"#d4e8c2",fontFamily:"Georgia,serif"},
    hdr:{background:"linear-gradient(135deg,#1a2e1a,#0c160c)",borderBottom:"1px solid #2d4a2d",padding:"16px 20px 0"},
    card:{background:"#1a2e1a",border:"1px solid #2d4a2d",borderRadius:10,padding:"14px 18px",marginBottom:12},
    box:(b="#3a5a3a")=>({background:b+"18",border:`1px solid ${b}`,borderRadius:8,padding:"10px 14px",marginBottom:12}),
    inp:{background:"#0c160c",border:"1px solid #3a5a3a",borderRadius:6,color:"#d4e8c2",padding:"5px 8px",fontSize:13,width:"100%",boxSizing:"border-box",fontFamily:"Georgia,serif",colorScheme:"dark"},
    numInp:{background:"#0c160c",border:"1px solid #2d4a2d",borderRadius:5,color:"#d4e8c2",padding:"4px",fontSize:13,width:52,textAlign:"center",fontFamily:"Georgia,serif"},
    btn:(bg="#3a7a3a")=>({background:bg,border:"none",borderRadius:6,color:"#fff",padding:"6px 12px",cursor:"pointer",fontSize:12,fontFamily:"Georgia,serif"}),
    th:(c="#5a8a5a")=>({padding:"6px 8px",color:c,fontWeight:"bold",fontSize:11,whiteSpace:"nowrap",textAlign:"center",borderBottom:"2px solid #2d4a2d"}),
    thL:{padding:"6px 10px",color:"#5a8a5a",fontWeight:"bold",fontSize:11,textAlign:"left",borderBottom:"2px solid #2d4a2d"},
    td:{padding:"4px 5px",textAlign:"center",fontSize:12},
    tdn:(c,dim)=>({padding:"4px 6px",textAlign:"center",fontSize:12,color:c||"#d4e8c2",fontWeight:"bold",opacity:dim?0.3:1}),
    tdl:{padding:"4px 8px",textAlign:"left",fontSize:11,color:"#5a8a5a",whiteSpace:"nowrap"},
    row:(i)=>({background:i%2===0?"#0c160c":"#111e11",borderBottom:"1px solid #1a2e1a"}),
    fieldLabel:{fontSize:10,color:"#5a8a5a",display:"block",marginBottom:3},
  };

  const tabs=["today","sheet","thisweek","graph","bank","tracker","history","seasonal","setup","suppliers"];
  const tabLabels={today:"📊 Dashboard",sheet:"📊 This Week",thisweek:"🌱 Tasks",graph:"📈 Forecast",bank:"🏦 Bank",tracker:"🗓️ Inventory",history:"📋 History",seasonal:"📅 Seasonal",setup:"⚙️ Setup",suppliers:"🤝 Suppliers"};

  const addSpecies=()=>{if(!ns.name.trim())return;setSpecies(p=>[...p,{id:Date.now(),...ns,name:ns.name.trim()}]);setNs({name:"",spawnWeeks:6,spawnDays:42,blockWeeks:4,blockIncubDays:17,fruitDays:11,blockDivisor:2,spawnBagBlocks:12,color:"#7ec8a0",exactFruit:false});};
  const addClient = (name, startDate, clientOrders, clientType, lastWeekOrds) => {
    if (!name.trim()) return;
    const newId = Date.now();

    const defaultSensitivity = (clientType||"restaurant")==="market" ? 1.0 : (clientType||"restaurant")==="store" ? 0.3 : 0.15;

  const addUpcoming=()=>{

  // ── Coverage offset: how many weeks of tracker inventory exist per species/type ──
  // ── Fruit checklist helpers ──
  function getFruitWeekKey() {
    const today = new Date(); today.setHours(0,0,0,0);
    const resetDay = schedule.fruitResetDay ?? 1;
    const dow = today.getDay();
    const daysBack = (dow - resetDay + 7) % 7;
    const weekStart = new Date(today); weekStart.setDate(today.getDate() - daysBack);
    return weekStart.toISOString().slice(0,10);
  }

  function getFruitEntries(spId) {
    const key = getFruitWeekKey();
    const val = fruitLoaded[spId]?.[key];
    if (!val) return [];
    if (Array.isArray(val)) return val;
    // Old format was a number — convert to array
    return [{ id: 0, qty: val }];
  }

  function getFruitLoaded(spId) {
    return r2(getFruitEntries(spId).reduce((a, e) => a + e.qty, 0));
  }

  // ── Substitution helpers ─────────────────────────────────────────────────
  // Get total blocks substituting FROM a species (reducing its coverage)
  function getSubstitutedOut(spId) {
    return r2(substitutions.filter(s=>s.fromSpeciesId===spId).reduce((a,s)=>a+s.qty,0));
  }
  // Get total blocks substituting INTO a species (increasing its coverage)
  function getSubstitutedIn(spId) {
    return r2(substitutions.filter(s=>s.toSpeciesId===spId).reduce((a,s)=>a+s.qty,0));
  }
  // Get how many blocks of a tracker entry are already tagged as substitutions
  function getEntryTagged(entryId) {
    return r2(substitutions.filter(s=>s.trackerEntryId===entryId).reduce((a,s)=>a+s.qty,0));
  }
  // Get the next available batch for substitution — latest untagged/partial batch first
  function getNextSubBatch(fromSpId) {
    const batches = tracker
      .filter(e=>e.type==="block" && !e.entryClass && (e.speciesId||e.sid)===fromSpId && parseFloat(e.qty)>0)
      .sort((a,b)=>new Date(b.date)-new Date(a.date)); // newest first
    for(const batch of batches) {
      const tagged = getEntryTagged(batch.id);
      const available = r2(parseFloat(batch.qty) - tagged);
      if(available > 0) return { batch, available, tagged };
    }
    return null;
  }
  // Add a substitution
  function addSubstitution(fromSpId, toSpId, trackerEntryId, qty, date) {
    setSubstitutions(p=>[...p, {
      id: Date.now(),
      fromSpeciesId: fromSpId,
      toSpeciesId: toSpId,
      trackerEntryId,
      qty: r2(qty),
      date,
      createdAt: new Date().toISOString()
    }]);
  }
  // Remove a substitution
  function removeSubstitution(subId) {
    setSubstitutions(p=>p.filter(s=>s.id!==subId));
  }
  // Clear all substitutions (for testing/reset)
  function clearSubstitutions() {
    setSubstitutions([]);
  }

  function addFruitLoaded(spId, qty) {
    const key = getFruitWeekKey();
    setFruitLoaded(prev => ({
      ...prev,
      [spId]: {
        ...(prev[spId]||{}),
        [key]: [...(prev[spId]?.[key]||[]), { id: Date.now(), qty }]
      }
    }));
  }

  function undoLastFruitLoad(spId) {
    const key = getFruitWeekKey();
    setFruitLoaded(prev => {
      const entries = prev[spId]?.[key] || [];
      if (entries.length === 0) return prev;
      return {
        ...prev,
        [spId]: { ...(prev[spId]||{}), [key]: entries.slice(0, -1) }
      };
    });
  }

  // ── Quick log popup handlers ──
  function openQuickLog(type, spId, value, field) {
    const rounded = Math.round(value * 2) / 2;
    // Default spawn bags used = blocks / 12, rounded to nearest 0.25
    const defaultSpawn = type === 'block' ? Math.round((rounded / 12) * 4) / 4 : 0;
    setQuickLog({ type, speciesId:spId, value:rounded, originalValue:value, date:todayStr(), field, spawnBagsUsed:defaultSpawn });
  }

  function confirmQuickLog() {
    if(!quickLog) return;
    if(quickLog.field === 'fruit') {
      setBlockLoadGuide({ speciesId: quickLog.speciesId, qty: quickLog.value, planned:{}, idx:0 });
      setQuickLog(null);
      return;
    } else {
      if(quickLog.type === 'block') {
        setSpawnGuide({ speciesId: quickLog.speciesId, blocks: quickLog.value, date: quickLog.date, note: 'Quick log', planned:{}, idx:0 });
        setQuickLog(null);
        return;

      const newEntry = {
        id: Date.now(),
        type: quickLog.type,
        speciesId: quickLog.speciesId,
        date: quickLog.date,

      setTracker(p => [...p, newEntry]);

    setQuickLog(null);

  // ── Client quote: lead time analysis for a new client ────────────────────
  const clientQuote = useMemo(()=>{
    const ordersToCheck = showClientQuote === "upcoming"
      ? newUp.orders
      : nc.orders;
    const startDate = showClientQuote === "upcoming"
      ? newUp.startDate
      : nc.startDate;
    if (!ordersToCheck || Object.keys(ordersToCheck).filter(k=>ordersToCheck[k]>0).length === 0) return null;

    const startDayOffset = dateToDayOffset(startDate);
    const results = [];

    species.forEach(sp => {
      const lbs = parseFloat(ordersToCheck[sp.id]) || 0;
      if (lbs === 0) return;

      const blocksNeeded = r2(lbs / sp.blockDivisor);
      const spawnNeeded  = r2(blocksNeeded / getSpawnBagBlocks(sp));
      const bankData     = simplBank[sp.id];
      const surplusBlocks = bankData?.surplusBlocks || 0;
      const surplusSpawn  = bankData?.surplusSpawn  || 0;

      // Earliest possible delivery = today + blockWeeks lead time
      const earliestDeliveryDays = sp.blockWeeks * 7;
      const canMeetDate = startDayOffset >= earliestDeliveryDays;
      const earliestLabel = daysLabel(earliestDeliveryDays);

      // Can bank surplus cover the gap while new blocks grow?
      const bankCoversGap = surplusBlocks >= blocksNeeded;

      // How many days until we can deliver if starting today
      const daysUntilReady = Math.max(0, earliestDeliveryDays - startDayOffset);
      const weeksUntilReady = Math.ceil(daysUntilReady / 7);

      // What to start today
      const startSpawnToday  = r2(spawnNeeded);
      const startBlocksToday = r2(blocksNeeded);

      let status, statusColor;
      if (bankCoversGap) {
        status = "✅ Can deliver from bank immediately";
        statusColor = "#7ec8a0";
      } else if (canMeetDate) {
        status = "✅ Can meet start date — start batches now";
        statusColor = "#7ec8a0";
      } else if (daysUntilReady <= 14) {
        status = `⏳ Ready in ${weeksUntilReady} wk${weeksUntilReady!==1?"s":""} — close!`;
        statusColor = "#f4d06f";
      } else {
        status = `⚠️ ${weeksUntilReady} wks behind — earliest ${earliestLabel}`;
        statusColor = "#e07b8a";
      }

      results.push({
        sp, lbs, blocksNeeded, spawnNeeded,
        surplusBlocks, bankCoversGap,
        canMeetDate, earliestLabel, daysUntilReady, weeksUntilReady,
        startSpawnToday, startBlocksToday,
        status, statusColor,
      });
    });

    return results;
  }, [newUp, nc, showClientQuote, species, simplBank]);

  // ── Order submission system ──────────────────────────────────────────────

  // Get the Monday-based week key for a given date or offset
  function getWeekKey(dateOrOffset) {
    return getWeekKeyGlobal(dateOrOffset, schedule.weekStartDay ?? 1);
  }
  function getOrderWeekKey(offsetWeeks = 0) { return getWeekKey(offsetWeeks); }

  // The current week key and last week key
  const thisWeekKey = getWeekKey(0);
  const lastWeekKey = getWeekKey(-1);

  // Has the user submitted last week's orders yet?
  const needsSubmission = lastSubmittedWeek !== lastWeekKey;

  // How many weeks have been missed?
  function getMissedWeeks() {
    if (!lastSubmittedWeek) return [];
    const missed = [];
    let check = new Date(lastSubmittedWeek);
    check.setDate(check.getDate() + 7);
    const lastWeekDate = new Date(lastWeekKey);
    while (check <= lastWeekDate) {
      const key = check.toISOString().slice(0,10);
      if (!orderHistory[key]?._confirmed) missed.push(key);
      check.setDate(check.getDate() + 7);
    }
    return missed;
  }

  // Submit orders for a specific week
  function submitWeekOrders(weekKey, ordersToSubmit, confirmed = true) {
    setOrderHistory(prev => {
      const next = {...prev};
      // Store orders per client
      const entry = { _confirmed: confirmed, _date: weekKey };
      clients.forEach(cl => {
        entry[cl.id] = {};
        species.forEach(sp => {
          const lbs = parseFloat(ordersToSubmit[cl.id]?.[sp.id] ?? 0) || 0;
          if (lbs > 0) entry[cl.id][sp.id] = lbs;
        });
      });
      next[weekKey] = entry;
      // Keep all history (no cap — builds multi-year curve)
      return next;
    });
    if (confirmed) setLastSubmittedWeek(weekKey);
  }

  // Auto-fill missed weeks with estimated values
  function autoFillMissedWeeks() {
    const missed = getMissedWeeks();
    missed.forEach(weekKey => {
      if (!orderHistory[weekKey]?._confirmed) {
        // Use baseline projected for that week
        const weekOffset = Math.round((new Date(weekKey) - new Date()) / (7*24*60*60*1000));
        const todayMult = getSeasonal(0, seasonal);
        const estimated = {};
        clients.forEach(cl => {
          estimated[cl.id] = {};
          species.forEach(sp => {
            const base = getBaselineLbs(cl.id, sp.id);
            if (base > 0) {
              const mult = getSeasonal(weekOffset, seasonal);
              estimated[cl.id][sp.id] = r2(base * (mult / todayMult));
            }
          });
        });
        submitWeekOrders(weekKey, estimated, false); // false = not confirmed
      }
    });
  }

  // Get client total lbs baseline — total across all species, seasonally normalized
  // Keeps zeros to learn slow-season patterns, applies production floor
  function getClientTotalLbsHistory(cId) {
    return Object.entries(orderHistory)
      .filter(([k,v]) => k !== '_confirmed' && v._confirmed)
      .map(([weekKey, entry]) => {
        let total = 0;
        species.forEach(sp => { total += parseFloat(entry[cId]?.[sp.id] ?? 0) || 0; });
        return { weekKey, total };
      })
      .filter(w => w.total >= 0); // keep zeros
  }

  function getBaselineLbs(cId, sId) {
    const history = getClientTotalLbsHistory(cId);
    const currentOrders = parseFloat(orders[cId]?.[sId] ?? 0) || 0;

    if (history.length < 4) {
      // Not enough history — use current orders
      return currentOrders;
    }

    // Use last 8 weeks for rolling average
    const recent = history.sort((a,b)=>b.weekKey.localeCompare(a.weekKey)).slice(0,8);

    // Normalize each week's TOTAL to season-neutral
    const todayMult = getSeasonal(0, seasonal);
    let totalNorm = 0;
    recent.forEach(({weekKey, total}) => {
      const weekOffsetWeeks = Math.round((new Date(weekKey) - new Date()) / (7*24*60*60*1000)) / 7;
      const mult = getSeasonal(weekOffsetWeeks, seasonal) || todayMult;
      totalNorm += total / mult;
    });
    const avgNormTotal = totalNorm / recent.length;

    // Midpoint seasonal adjustment
    const midpointMult = getSeasonal(-Math.floor(recent.length/2), seasonal);
    const projectedTotal = r2(avgNormTotal * midpointMult);

    // Apply production floor (50% of simple average total)
    const simpleAvgTotal = r2(recent.reduce((s,w)=>s+w.total,0) / recent.length);
    const floor = r2(simpleAvgTotal * (schedule.productionFloor ?? 0.5));
    const flooredTotal = Math.max(projectedTotal, floor);

    // Scale the species lbs proportionally from total
    // Use current orders ratio to distribute the total
    let currentTotal = 0;
    species.forEach(sp => { currentTotal += parseFloat(orders[cId]?.[sp.id] ?? 0) || 0; });
    if (currentTotal === 0) return currentOrders;

    const ratio = currentOrders / currentTotal;
    return r2(flooredTotal * ratio);
  }

  function getOrderWeekKey(offsetWeeks = 0) { return getWeekKey(offsetWeeks); }

  // ── Pricing helpers ──────────────────────────────────────────────────────
  function getPrice(cl, spId) {
    const sp = species.find(s => s.id === spId);
    if (!sp) return 0;
    if (cl.priceOverrides?.[spId] !== undefined) return cl.priceOverrides[spId];
    return cl.clientType === "market" ? (sp.retail || 0) : (sp.wholesale || 0);
  }

  function clientWeeklyRevenue(cl) {
    let total = 0;
    species.forEach(sp => {
      const lbs = parseFloat(orders[cl.id]?.[sp.id] ?? 0) || 0;
      total += lbs * getPrice(cl, sp.id);
    });
    return r2(total);
  }

  function upcomingRevenue(item) {
    if (!item.orders) return 0;
    let total = 0;
    const tier = item.clientType === "market" ? "retail" : "wholesale";
    species.forEach(sp => {
      const lbs = parseFloat(item.orders[sp.id] ?? 0) || 0;
      const price = tier === "retail" ? (sp.retail || 0) : (sp.wholesale || 0);
      total += lbs * price;
    });
    return r2(total);
  }

  // ── Client Quote Panel ───────────────────────────────────────────────────
  const ClientQuotePanel = (clientQuote && clientQuote.length > 0) ? (

  ) : null;

  // ── Quick Log Popup ──────────────────────────────────────────────────────
  const QuickLogPopup = quickLog ? (()=>{
    const sp = species.find(s=>s.id===quickLog.speciesId);
    const isFruit = quickLog.field==='fruit';
    const tw = thisWeek.find(s=>s.id===quickLog.speciesId);

    return (

        <div style={{background:"#1a2e1a",border:"2px solid #3a5a3a",borderRadius:12,padding:"20px 24px",minWidth:260,maxWidth:320}} onClick={e=>e.stopPropagation()}>
          <p style={{margin:"0 0 4px",fontSize:11,color:"#5a8a5a"}}>{isFruit?"🚪 Load fruiting room":quickLog.type==="spawn"?"🌾 Spawn bags":"🧱 Blocks"}</p>
          <p style={{margin:"0 0 14px",fontSize:16,fontWeight:"bold",color:sp?.color||"#7ec8a0"}}>{sp?.name}</p>

              <span style={{color:"#5a8a5a",marginLeft:10}}>Remaining after: </span>

          {/* Spawn bag allocation handled by guided popup */}

          <p style={{margin:"0 0 6px",fontSize:11,color:"#5a8a5a"}}>Date:</p>
          <input type="date" value={quickLog.date} onChange={e=>setQuickLog(p=>({...p,date:e.target.value}))}
            style={{...S.inp,marginBottom:10,colorScheme:"dark"}}/>

          {/* Capacity overflow warning for block logging */}
          {quickLog.type==="block"&&!isFruit&&(()=>{
            const sp2 = species.find(s=>s.id===quickLog.speciesId);
            if(!sp2) return null;
            const blkIncubDays = getBlockIncubDays(sp2);
            const fruitLoadOffset = Math.round((new Date(quickLog.date+'T12:00:00')-new Date()+(blkIncubDays*24*60*60*1000))/(24*60*60*1000));
            const projFruit = getRoomOccupancy(fruitLoadOffset);

            const overflow = (projFruit.fruiting + quickLog.value) - fruitCap;
            if(overflow<=0) return null;
            const blockSuppliers = suppliers.filter(s=>s.blockSpecies?.[sp2.id]);
            const freshSuppliers = suppliers.filter(s=>s.freshSpecies?.[sp2.id]);
            const lbsNeeded = r2(overflow * sp2.blockDivisor);
            const loadDate = new Date(); loadDate.setDate(loadDate.getDate()+fruitLoadOffset);

            return(
              <div style={{background:"#1a0a0a",border:"1px solid #8a3a3a",borderRadius:8,padding:"8px 12px",marginBottom:10}}>

                <p style={{margin:"0 0 6px",fontSize:10,color:"#a8c890"}}>{overflow} blocks over capacity on {loadLabel} — need ~{lbsNeeded} lbs from supplier</p>

                {/* Block suppliers */}
                {blockSuppliers.length>0&&(
                  <div style={{marginBottom:6}}>
                    <p style={{margin:"0 0 4px",fontSize:10,color:"#a78bda",fontWeight:"bold"}}>🧱 Order blocks:</p>
                    {blockSuppliers.map(sup=>{
                      const delivOffset = fruitLoadOffset - (blkIncubDays - (sup.blockSpecies[sp2.id]||14));
                      const orderDate = new Date(); orderDate.setDate(orderDate.getDate()+delivOffset-(sup.leadDays||7));
                      const orderLabel = orderDate.toLocaleDateString("en-CA",{month:"short",day:"numeric"});
                      return(
                        <div key={sup.id} style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:3}}>
                          <span style={{fontSize:10,color:"#7ec8a0"}}>{sup.name}:</span>
                          <span style={{fontSize:10,color:"#5a8a5a"}}>order by {orderLabel}</span>
                          <button onClick={()=>{
                            const subject=encodeURIComponent(`Block order — ${sp2.name}`);
                            const body=encodeURIComponent(`Hi ${sup.name},\n\nI need ${overflow} ${sp2.name} blocks (approx ${lbsNeeded} lbs) ready to load into fruiting room by ${loadLabel}.\n\nPlease confirm availability.\n\nThank you`);
                            window.open(`mailto:${sup.email}?subject=${subject}&body=${body}`);
                          }} style={{...S.btn("#1a3a5a"),padding:"2px 8px",fontSize:10,border:"1px solid #3a6a9a"}}>📧 Email</button>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Fresh mushroom suppliers */}
                {freshSuppliers.length>0&&(
                  <div style={{marginBottom:6}}>
                    <p style={{margin:"0 0 4px",fontSize:10,color:"#7ec8a0",fontWeight:"bold"}}>🍄 Order fresh mushrooms:</p>
                    {freshSuppliers.map(sup=>{
                      const freshData = sup.freshSpecies[sp2.id];
                      // Mushrooms needed by: fruiting room full date + fruitDays (harvest date)
                      const deliveryNeededBy = fruitLoadOffset + sp2.fruitDays;
                      // Total lead time supplier needs
                      const totalLeadDays = freshData==="grow"
                        ? (blkIncubDays + sp2.fruitDays + (sup.leadDays||7))
                        : (sup.leadDays||7);
                      // Order deadline = delivery needed by - total lead time
                      const orderDeadlineDays = deliveryNeededBy - totalLeadDays;
                      const orderDate = new Date(); orderDate.setDate(orderDate.getDate()+orderDeadlineDays);
                      const orderLabel = orderDate.toLocaleDateString("en-CA",{month:"short",day:"numeric"});
                      const harvestDate = new Date(); harvestDate.setDate(harvestDate.getDate()+deliveryNeededBy);
                      const harvestLabel = harvestDate.toLocaleDateString("en-CA",{month:"short",day:"numeric"});
                      const urgent = orderDeadlineDays <= 0;
                      return(
                        <div key={sup.id} style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:3}}>
                          <span style={{fontSize:10,color:"#7ec8a0"}}>{sup.name}:</span>
                          <span style={{fontSize:10,color:urgent?"#e07b8a":"#5a8a5a"}}>
                            {freshData==="grow"?"grow to order":"from stock"} · {urgent?"order TODAY":"order by "+orderLabel}
                          </span>
                          <button onClick={()=>{
                            const subject=encodeURIComponent(`Fresh mushroom order — ${sp2.name}`);
                            const body=encodeURIComponent(`Hi ${sup.name},\n\nI need ${lbsNeeded} lbs of fresh ${sp2.name} mushrooms delivered by ${harvestLabel}.\n\nPlease confirm availability.\n\nThank you`);
                            window.open(`mailto:${sup.email}?subject=${subject}&body=${body}`);
                          }} style={{...S.btn("#1a3a1a"),padding:"2px 8px",fontSize:10,border:"1px solid #3a6a3a"}}>📧 Email</button>
                        </div>
                      );
                    })}
                  </div>
                )}

                {blockSuppliers.length===0&&freshSuppliers.length===0&&(
                  <p style={{margin:0,fontSize:10,color:"#5a8a5a"}}>No suppliers set up for {sp2.name} — add in Suppliers tab</p>
                )}
              </div>
            );
          })()}

          <div style={{display:"flex",gap:8}}>
            <button onClick={confirmQuickLog}
              style={{...S.btn(),flex:1,padding:"10px",fontSize:14}}>✓ Confirm</button>
            <button onClick={()=>setQuickLog(null)}
              style={{...S.btn("#5a2a2a"),padding:"10px 14px",fontSize:14}}>✕</button>
          </div>
        </div>
      </div>
    );
  })() : null;

  const SpawnGuidePopup = spawnGuide ? (()=>{
    const sp = species.find(s=>s.id===spawnGuide.speciesId);
    if(!sp) return null;

    // Target blocks (editable, pre-filled from Tasks hold-to-log)
    const targetBlocks = r2(parseFloat(spawnGuide.blocks)||0);
    const targetBags = r2(targetBlocks / getSpawnBagBlocks(sp));

    const allEntries = (tracker||[])
      .filter(e=>e.type==="spawn" && (e.speciesId||e.sid)===spawnGuide.speciesId && e.entryClass!=="consumed" && (parseFloat(e.qty)||0)>0)
      .sort((a,b)=>a.date.localeCompare(b.date));

    const inputs = spawnGuide.inputs || null; // { [entryId]: qtyUsed }
    const visibleCount = spawnGuide.visibleCount ?? null;

    // Lazy initialize default inputs once
    if(!inputs || visibleCount===null){
      // Show only the oldest batches needed to cover the target by default.
      let need = targetBags;
      let coverCount = 0;
      for(const e of allEntries){
        if(need<=0) break;
        coverCount++;
        need = r2(need - (parseFloat(e.qty)||0));
      }
      coverCount = Math.max(0, coverCount);

      let rem = targetBags;
      const init = {};
      allEntries.slice(0, coverCount).forEach(e=>{
        const avail = r2(parseFloat(e.qty)||0);
        const use = r2(Math.max(0, Math.min(avail, rem)));
        init[e.id] = use || 0;
        rem = r2(rem - use);
      });
      setTimeout(()=>setSpawnGuide(p=>({...p, inputs:init, visibleCount:coverCount})),0);
      return null;
    }

    const shownEntries = allEntries.slice(0, Math.min(visibleCount, allEntries.length));
    const selectedBags = r2(shownEntries.reduce((s,e)=>s + (r2(parseFloat(inputs[e.id])||0)),0));
    const selectedBlocks = r2(selectedBags * getSpawnBagBlocks(sp));

    function close(){ setSpawnGuide(null); }

    function revealNext(){
      const next = allEntries[visibleCount];
      if(!next) return;
      const avail = r2(parseFloat(next.qty)||0);
      const remaining = r2(Math.max(0, targetBags - selectedBags));
      const def = r2(Math.max(0, Math.min(avail, remaining)));
      setSpawnGuide(p=>({
        ...p,
        visibleCount: (p.visibleCount||0) + 1,
        inputs: { ...(p.inputs||{}), [next.id]: (p.inputs?.[next.id] ?? def) }
      }));
    }

    function confirm(){
      const blocksToLog = r2(parseFloat(spawnGuide.blocks)||0);
      if(!blocksToLog || blocksToLog<=0){ setSpawnGuide(null); return; }

      // Deduct spawn bags per user inputs (delete if fully used)
      setTracker(prev=>{
        const next = [];
        (prev||[]).forEach(e=>{
          if(e.type==="spawn" && (e.speciesId||e.sid)===spawnGuide.speciesId && inputs[e.id]!=null){
            const use = r2(parseFloat(inputs[e.id])||0);
            const newQty = r2((parseFloat(e.qty)||0) - use);
            if(newQty>0) next.push({...e, qty:newQty});
            // drop if fully used
          } else next.push(e);
        });
        next.push({ id:Date.now(), type:"block", speciesId:spawnGuide.speciesId, date:spawnGuide.date, qty:blocksToLog, note:spawnGuide.note||"" });
        return next;
      });

      setSpawnGuide(null);
    }

    return(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,padding:18}}>
        <div style={{background:"#0c160c",border:"2px solid #e8a87c",borderRadius:12,padding:"14px 16px",maxWidth:680,width:"100%"}}>
          <p style={{margin:"0 0 6px",fontSize:13,fontWeight:"bold",color:"#e8a87c"}}>🧱 Inoculate blocks</p>
          <p style={{margin:"0 0 10px",fontSize:11,color:"#5a8a5a"}}>
            Species: <strong style={{color:sp.color}}>{sp.name}</strong>
          </p>

          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",marginBottom:10}}>
            <span style={{fontSize:11,color:"#5a8a5a"}}>Target blocks</span>
            <input
              type="number"
              min="0"
              step="0.5"
              value={spawnGuide.blocks}
              onChange={e=>setSpawnGuide(p=>({...p, blocks:e.target.value}))}
              style={{...S.numInp,width:90}}
            />
            <span style={{fontSize:11,color:"#5a5a8a"}}>{fmt(targetBags)} bags needed</span>
            <span style={{marginLeft:"auto",fontSize:11,color:"#5a8a5a"}}>
              <strong style={{color:"#d4e8c2"}}>{fmt(selectedBags)}</strong> of <strong style={{color:"#d4e8c2"}}>{fmt(targetBags)}</strong> selected
            </span>
          </div>

          <div style={{maxHeight:320,overflowY:"auto",border:"1px solid #1a2e1a",borderRadius:8,padding:"8px 10px",marginBottom:12}}>
            {shownEntries.length===0 && <p style={{margin:0,fontSize:12,color:"#3a5a3a"}}>No spawn bag batches available.</p>}
            {shownEntries.map((e,i)=>{
              const avail = r2(parseFloat(e.qty)||0);
              const val = inputs[e.id] ?? 0;
              return(
                <div key={e.id} style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",padding:"6px 0",borderBottom:i<shownEntries.length-1?"1px solid #111e11":"none"}}>
                  <span style={{fontSize:11,color:"#5a8a5a",minWidth:92}}>{e.date}</span>
                  <span style={{fontSize:11,color:"#5a8a5a"}}>Avail: <strong style={{color:"#d4e8c2"}}>{fmt(avail)}</strong></span>
                  <input
                    type="number"
                    min="0"
                    step="0.25"
                    value={val}
                    onChange={ev=>{
                      const raw = parseFloat(ev.target.value);
                      const nextVal = r2(Math.max(0, Math.min(avail, isNaN(raw)?0:raw)));
                      setSpawnGuide(p=>({...p, inputs:{...(p.inputs||{}), [e.id]: nextVal }}));
                    }}
                    style={{...S.numInp,width:90}}
                  />
                </div>
              );
            })}
          </div>
          {allEntries.length > visibleCount && (
            <button onClick={revealNext} style={{...S.btn("#2a2a2a"),border:"1px solid #a78bda",marginTop:-4,marginBottom:12,width:"100%"}}>
              Reveal next batch
            </button>
          )}

          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={confirm} style={{...S.btn("#3a7a3a"),fontWeight:"bold",flex:1}}>Confirm</button>
            <button onClick={close} style={{...S.btn("#3a2a2a")}}>Close</button>
          </div>
        </div>
      </div>
    );
  })() : null;

  const BlockLoadGuidePopup = blockLoadGuide ? (()=>{
    const sp = species.find(s=>s.id===blockLoadGuide.speciesId);
    if(!sp) return null;
    const todayKey = todayStr();
    const today = new Date(todayKey+'T12:00:00'); today.setHours(0,0,0,0);
    const incubDays = getBlockIncubDays(sp);
    const allEntries = (tracker||[])
      .filter(e=>e.type==="block" && (e.speciesId||e.sid)===blockLoadGuide.speciesId && e.entryClass!=="loss" && e.entryClass!=="consumed" && (parseFloat(e.qty)||0)>0)
      .map(e=>{
        const inoc = new Date((e.date||todayKey)+'T12:00:00'); inoc.setHours(0,0,0,0);
        const age = Math.floor((today - inoc)/86400000);
        return {...e, _age:age};
      })
      .sort((a,b)=>a.date.localeCompare(b.date));
    const inputs = blockLoadGuide.inputs || null; // { [entryId]: qtyToLoad }
    const target = r2(parseFloat(blockLoadGuide.qty)||0);

    const readyEntries = allEntries.filter(e=>e._age >= incubDays);
    const unreadyEntries = allEntries.filter(e=>e._age < incubDays);
    const revealedUnready = Math.min(blockLoadGuide.revealUnreadyCount||0, unreadyEntries.length);
    const shownEntries = [...readyEntries, ...unreadyEntries.slice(0, revealedUnready)];

    // Lazy initialize defaults once
    if(!inputs){
      let rem = target;
      const init = {};
      shownEntries.forEach(e=>{
        const avail = r2(parseFloat(e.qty)||0);
        const use = r2(Math.max(0, Math.min(avail, rem)));
        init[e.id] = use || 0;
        rem = r2(rem - use);
      });
      setTimeout(()=>setBlockLoadGuide(p=>({...p, inputs:init})),0);
      return null;
    }

    const selected = r2(shownEntries.reduce((s,e)=>s+(r2(parseFloat(inputs[e.id])||0)),0));

    function close(){ setBlockLoadGuide(null); }

    function revealNext(){
      const nextIdx = (blockLoadGuide.revealUnreadyCount||0);
      const next = unreadyEntries[nextIdx];
      if(!next) return;
      const avail = r2(parseFloat(next.qty)||0);
      const remaining = r2(Math.max(0, target - selected));
      const def = r2(Math.max(0, Math.min(avail, remaining)));
      setBlockLoadGuide(p=>({
        ...p,
        revealUnreadyCount: (p.revealUnreadyCount||0) + 1,
        inputs: { ...(p.inputs||{}), [next.id]: (p.inputs?.[next.id] ?? def) }
      }));
    }

    function confirm(){
      const targetQty = r2(parseFloat(blockLoadGuide.qty)||0);
      // Confirm is always enabled; if 0 just close.
      if(!targetQty || targetQty<=0){ setBlockLoadGuide(null); return; }

      // Remove selected qty from tracker (delete if fully used)
      setTracker(prev=>{
        const next = [];
        (prev||[]).forEach(e=>{
          if(e.type==="block" && (e.speciesId||e.sid)===blockLoadGuide.speciesId && inputs[e.id]!=null){
            const use = r2(parseFloat(inputs[e.id])||0);
            const newQty = r2((parseFloat(e.qty)||0) - use);
            if(newQty>0) next.push({...e, qty:newQty});
          } else next.push(e);
        });
        return next;
      });

      // Add each used batch as its own fruitingRoom entry (today loadDate)
      const newRoomEntries = shownEntries
        .map(e=>{
          const use = r2(parseFloat(inputs[e.id])||0);
          if(!use || use<=0) return null;
          return { id:Date.now()+e.id, speciesId:blockLoadGuide.speciesId, qty:use, loadDate:todayKey, fruitDays:sp.fruitDays, srcDate:e.date };
        })
        .filter(Boolean)
        // strip srcDate (kept only for stable id mixing above)
        .map(({srcDate, ...rest})=>rest);

      if(newRoomEntries.length){
        setFruitingRoom(p=>[...(p||[]), ...newRoomEntries]);
      }

      // Keep existing weekly progress logic consistent
      if(selected>0) addFruitLoaded(blockLoadGuide.speciesId, selected);

      setBlockLoadGuide(null);
    }

    return(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,padding:18}}>
        <div style={{background:"#0c160c",border:"2px solid #7ec8a0",borderRadius:12,padding:"14px 16px",maxWidth:680,width:"100%"}}>
          <p style={{margin:"0 0 6px",fontSize:13,fontWeight:"bold",color:"#7ec8a0"}}>🚪 Load fruiting room</p>
          <p style={{margin:"0 0 10px",fontSize:11,color:"#5a8a5a"}}>
            Species: <strong style={{color:sp.color}}>{sp.name}</strong> · Ready batches only (≥ {incubDays}d incubated)
          </p>

          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",marginBottom:10}}>
            <span style={{fontSize:11,color:"#5a8a5a"}}>Target blocks</span>
            <input
              type="number"
              min="0"
              step="0.5"
              value={blockLoadGuide.qty}
              onChange={e=>setBlockLoadGuide(p=>({...p, qty:e.target.value}))}
              style={{...S.numInp,width:90}}
            />
            <span style={{marginLeft:"auto",fontSize:11,color:"#5a8a5a"}}>
              <strong style={{color:"#d4e8c2"}}>{fmt(selected)}</strong> of <strong style={{color:"#d4e8c2"}}>{fmt(target)}</strong> selected
            </span>
          </div>

          <div style={{maxHeight:320,overflowY:"auto",border:"1px solid #1a2e1a",borderRadius:8,padding:"8px 10px",marginBottom:12}}>
            {shownEntries.length===0 && <p style={{margin:0,fontSize:12,color:"#3a5a3a"}}>No ready block batches available.</p>}
            {shownEntries.map((e,i)=>{
              const avail = r2(parseFloat(e.qty)||0);
              const val = inputs[e.id] ?? 0;
              return(
                <div key={e.id} style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",padding:"6px 0",borderBottom:i<shownEntries.length-1?"1px solid #111e11":"none"}}>
                  <span style={{fontSize:11,color:"#5a8a5a",minWidth:92}}>{e.date}</span>
                  <span style={{fontSize:11,color:"#5a8a5a"}}>Avail: <strong style={{color:"#d4e8c2"}}>{fmt(avail)}</strong></span>
                  {e._age < incubDays && <span style={{fontSize:10,color:"#a78bda"}}>({e._age}d incub)</span>}
                  <input
                    type="number"
                    min="0"
                    step="0.5"
                    value={val}
                    onChange={ev=>{
                      const raw = parseFloat(ev.target.value);
                      const nextVal = r2(Math.max(0, Math.min(avail, isNaN(raw)?0:raw)));
                      setBlockLoadGuide(p=>({...p, inputs:{...(p.inputs||{}), [e.id]: nextVal }}));
                    }}
                    style={{...S.numInp,width:90}}
                  />
                </div>
              );
            })}
          </div>
          {unreadyEntries.length > revealedUnready && (
            <button onClick={revealNext} style={{...S.btn("#2a2a2a"),border:"1px solid #a78bda",marginTop:-4,marginBottom:12,width:"100%"}}>
              Reveal next batch
            </button>
          )}

          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={confirm} style={{...S.btn("#3a7a3a"),fontWeight:"bold",flex:1}}>Confirm</button>
            <button onClick={close} style={{...S.btn("#3a2a2a")}}>Close</button>
          </div>
        </div>
      </div>
    );
  })() : null;

  return(
    <div style={S.page}>
      {QuickLogPopup}
      {SpawnGuidePopup}
      {BlockLoadGuidePopup}
      {toastLogged&&(
        <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:"#1a3a1a",border:"1px solid #7ec8a0",color:"#d4e8c2",padding:"8px 12px",borderRadius:10,fontSize:12,fontWeight:"bold",zIndex:10000}}>
          ✓ Logged
        </div>
      )}
      {/* Header */}
      <div style={S.hdr}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
