            <div>
              
              <p style={{margin:0,fontSize:10,color:"#5a8a5a"}}>Cambridge, Ontario</p>
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <p style={{margin:0,fontSize:12,color:"#7ec8a0",fontWeight:"bold"}}>{new Date().toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"})}</p>
            <p style={{margin:0,fontSize:10,color:"#5a8a5a"}}>{new Date().toLocaleDateString("en-CA",{weekday:"long"})}</p>
          </div>
        </div>
        <div style={{display:"flex",gap:2,flexWrap:"wrap"}}>
          {tabs.map(t=>(
            <button key={t} onClick={()=>setActiveTab(t)} style={{
              background:activeTab===t?"#7ec8a0":"transparent",color:activeTab===t?"#0c160c":"#7ec8a0",
              border:"1px solid #3a6a3a",borderBottom:"none",borderRadius:"5px 5px 0 0",
              padding:"5px 9px",cursor:"pointer",fontSize:11,fontFamily:"Georgia,serif",
              fontWeight:activeTab===t?"bold":"normal",whiteSpace:"nowrap",
            }}>{tabLabels[t]}</button>
          ))}
        </div>
      </div>

      <div style={{padding:"14px 18px",maxWidth:1300,margin:"0 auto"}}>

        {/* ── ORDERS ──────────────────────────────────────────────────────── */}
        {activeTab==="today"&&(
          <div>
            {/* ── WEATHER STRIP ──────────────────────────────────────────── */}
            {schedule.weatherEnabled!==false&&(()=>{
              const markets = clients.filter(cl=>cl.clientType==="market");
              const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
              const today = new Date(); today.setHours(0,0,0,0);
              const todayScore = weatherScores[0] || null; // first day in forecast = today
              const todayIcon = todayScore ? (todayScore.score>=0.7?"☀️":todayScore.score>=0.4?"⛅":"🌧️") : null;
              return(
                <div style={{background:"#0c1a0c",border:"1px solid #2d4a2d",borderRadius:8,padding:"8px 14px",marginBottom:8}}>
                  {/* Today's weather always shown */}
                  {todayScore&&(
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:markets.length?6:0,flexWrap:"wrap"}}>
                      <span style={{color:"#7ec8a0",fontWeight:"bold",fontSize:11,minWidth:80}}>Today</span>
                      <span style={{fontSize:10,color:todayScore.score>=0.7?"#7ec8a0":todayScore.score>=0.4?"#f4d06f":"#6bb8d4",background:"#0a160a",borderRadius:4,padding:"2px 6px",border:"1px solid #2d4a2d"}}>
                        {todayIcon} {todayScore.temp}°C
                      </span>
                    </div>
                  )}
                  {!todayScore&&weatherLoading&&(
                    <p style={{margin:0,fontSize:10,color:"#5a8a5a"}}>⏳ Fetching weather...</p>
                  )}
                  {!todayScore&&!weatherLoading&&(
                    <p style={{margin:0,fontSize:10,color:"#5a8a5a"}}>No weather data — tap Refresh in Setup</p>
                  )}
                  {/* Per-market upcoming days */}
                  {markets.map(cl=>{
                    const mDay = cl.marketDay??6;
                    const scores = getClientWeatherScores(cl);
                    if(!scores.length) return null;
                    const upcoming = scores.filter(w=>{
                      const d = new Date(w.date+'T12:00:00');
                      const daysAhead = Math.round((d-today)/(24*60*60*1000));
                      return d.getDay()===mDay && daysAhead>=0 && daysAhead<=28;
                    }).slice(0,4);
                    if(!upcoming.length) return null;
                    return(
                      <div key={cl.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
                        <span style={{color:"#6bb8d4",fontWeight:"bold",fontSize:11,minWidth:80}}>{cl.name}</span>
                        {upcoming.map(w=>{
                          const d = new Date(w.date+'T12:00:00');
                          const daysAhead = Math.round((d-today)/(24*60*60*1000));
                          const icon = w.score>=0.7?"☀️":w.score>=0.4?"⛅":"🌧️";
                          const label = daysAhead===0?"Today":daysAhead<=7?"This "+dayNames[mDay]:`${d.toLocaleDateString("en-CA",{month:"short",day:"numeric"})}`;
                          return(
                            <span key={w.date} style={{fontSize:10,color:w.score>=0.7?"#7ec8a0":w.score>=0.4?"#f4d06f":"#6bb8d4",background:"#0a160a",borderRadius:4,padding:"2px 6px",border:"1px solid #2d4a2d"}}>
                              {icon} {label} {w.temp}°
                            </span>
                          );
                        })}
                      </div>
                    );
                  })}
                  {/* General weather note if no markets */}
                  {markets.length===0&&weatherSummary&&(
                    <span style={{color:weatherSummary.color,fontSize:12,fontWeight:"bold"}}>{weatherSummary.text}</span>
                  )}
                </div>
              );
            })()}

            {/* ── ROOM CAPACITY STRIP ─────────────────────────────────────── */}
            {(()=>{
              const { weekData, incubCap, fruitCap } = capacitySimulation;
              const now = weekData[0]||{incub:0,fruit:0,incubPct:0,fruitPct:0};
              const next = weekData[1]||now;
              const hitDate = (w)=>{ const d=new Date(); d.setDate(d.getDate()+w*7); return d.toLocaleDateString("en-CA",{month:"short",day:"numeric"}); };
              const { firstIncubFull, firstFruitFull } = capacitySimulation;
              return(
                <div style={{background:"#0c160c",border:"1px solid #2d4a2d",borderRadius:8,padding:"8px 14px",marginBottom:8}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                    <div>
                      <p style={{margin:"0 0 4px",fontSize:10,color:"#5a8a5a",fontWeight:"bold"}}>🧱 Incubation Room</p>
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                        <span style={{fontSize:12,color:now.incubPct>=90?"#e07b8a":now.incubPct>=75?"#f4d06f":"#7ec8a0",fontWeight:"bold"}}>{now.incub}/{incubCap} ({now.incubPct}%)</span>
                        {next.incub!==now.incub&&<span style={{fontSize:10,color:"#5a8a5a"}}>→ {next.incub} next wk</span>}
                      </div>
                      {firstIncubFull!==null
                        ?<p style={{margin:"3px 0 0",fontSize:10,color:"#e07b8a"}}>⚠️ Full wk of {hitDate(firstIncubFull)}</p>
                        :<p style={{margin:"3px 0 0",fontSize:10,color:"#3a5a3a"}}>✓ No overflow in 12 wks</p>}
                    </div>
                    <div>
                      <p style={{margin:"0 0 4px",fontSize:10,color:"#5a8a5a",fontWeight:"bold"}}>🚪 Fruiting Room</p>
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                        <span style={{fontSize:12,color:now.fruitPct>=90?"#e07b8a":now.fruitPct>=75?"#f4d06f":"#7ec8a0",fontWeight:"bold"}}>{now.fruit}/{fruitCap} ({now.fruitPct}%)</span>
                        {next.fruit!==now.fruit&&<span style={{fontSize:10,color:"#5a8a5a"}}>→ {next.fruit} next wk</span>}
                      </div>
                      {firstFruitFull!==null
                        ?<p style={{margin:"3px 0 0",fontSize:10,color:"#e07b8a"}}>⚠️ Full wk of {hitDate(firstFruitFull)}</p>
                        :<p style={{margin:"3px 0 0",fontSize:10,color:"#3a5a3a"}}>✓ No overflow in 12 wks</p>}
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* ── CAPACITY ALERTS ──────────────────────────────────────────── */}
            {(()=>{
              const { weekData, incubCap, fruitCap } = capacitySimulation;
              const nextWk = weekData[1]||{incub:0,fruit:0}; // next week's projected occupancy
              const nextNextWk = weekData[2]||{incub:0,fruit:0};
              const alerts = [];

              // Alert 1: Next week's planned blocks won't fit in incubation room
              const incubRoom = incubCap - nextWk.incub;
              const nextWeekTarget = thisWeek.reduce((s,sp)=>s+(sp.blocks1||0),0);
              if(incubRoom < nextWeekTarget && nextWeekTarget > 0) {
                const canFit = Math.max(0, Math.round(incubRoom));
                const needToOrder = Math.round(nextWeekTarget - canFit);
                alerts.push({
                  id:"incub",
                  color:"#f4d06f",
                  icon:"🧱",
                  msg:`Next week's inoculation target is ${Math.round(nextWeekTarget)} blocks but incubation room only has room for ${canFit}. Order ${needToOrder} blocks from supplier this week.`
                });
              }

              // Alert 2: Next week's blocks won't fit in fruiting room when ready
              // Next week's blocks enter fruiting room at their harvest week
              // Use week 2 fruiting projection as proxy
              const fruitRoom = fruitCap - nextNextWk.fruit;
              if(fruitRoom < nextWeekTarget && nextWeekTarget > 0) {
                const canFit2 = Math.max(0, Math.round(fruitRoom));
                const needFresh = Math.round(nextWeekTarget - canFit2);
                const lbsNeeded = r2(needFresh * 2); // avg 2 lbs/block
                alerts.push({
                  id:"fruit",
                  color:"#e07b8a",
                  icon:"🚪",
                  msg:`Next week's blocks (${Math.round(nextWeekTarget)}) won't all fit in the fruiting room when ready. Order ${lbsNeeded} lbs of fresh mushrooms from supplier to cover the gap.`
                });
              }

              if(alerts.length===0) return null;
              return(
                <div style={{marginBottom:10}}>
                  {alerts.map(a=>(
                    <div key={a.id} style={{background:"#1a0e0a",border:`2px solid ${a.color}`,borderRadius:10,padding:"10px 14px",marginBottom:6}}>
                      <p style={{margin:0,fontSize:12,color:a.color,fontWeight:"bold"}}>{a.icon} {a.msg}</p>
                    </div>
                  ))}
                </div>
              );
            })()}

            {/* ── FRUITING ROOM ALERTS ─────────────────────────────────────── */}
            {fruitingAlerts.length>0&&(
              <div style={{background:fruitingAlerts.some(a=>a.urgent)?"#1a0e0a":"#0e1a0e",border:`2px solid ${fruitingAlerts.some(a=>a.urgent)?"#c8860a":"#3a6a3a"}`,borderRadius:10,padding:"10px 14px",marginBottom:10}}>
                <p style={{margin:"0 0 8px",fontSize:12,fontWeight:"bold",color:fruitingAlerts.some(a=>a.urgent)?"#c8860a":"#7ec8a0"}}>
                  🌡️ Fruiting Room Timing{fruitingAlerts.some(a=>a.urgent)?" — Act Soon":""}
                </p>
                {fruitingAlerts.map((alert,ai)=>(
                  <div key={ai} style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:ai<fruitingAlerts.length-1?6:0}}>
                    <span style={{color:alert.sp.color,fontWeight:"bold",fontSize:12}}>{alert.sp.name}</span>
                    <span style={{color:"#5a8a5a",fontSize:11}}>{alert.qty} blocks · {alert.daysInIncubation}d incubated</span>
                    {alert.daysUntilLoad===0
                      ?<span style={{color:"#c8860a",fontWeight:"bold",fontSize:11}}>⚡ Load TODAY for best weekend</span>
                      :<span style={{color:alert.urgent?"#c8860a":"#7ec8a0",fontSize:11}}>Load by {alert.loadDate} ({alert.daysUntilLoad}d) for good weekend</span>}
                  </div>
                ))}
              </div>
            )}

            {/* ── SUBSTITUTION REMINDER ────────────────────────────── */}
            {(()=>{
              const today = new Date(); today.setHours(0,0,0,0);
              const dow = today.getDay();
              const weekStartDay = schedule.weekStartDay ?? 1;
              const daysUntilStart = (weekStartDay - dow + 7) % 7;
              // Show reminder the day before week start
              if(daysUntilStart !== 1) return null;
              return(
                <div style={{background:"#1a1a2a",border:"2px solid #a78bda",borderRadius:10,padding:"12px 16px",marginBottom:14}}>
                  <p style={{margin:"0 0 4px",fontSize:13,color:"#a78bda",fontWeight:"bold"}}>🔄 Week starts tomorrow — review substitutions</p>
                  <p style={{fontSize:11,color:"#5a5a8a",margin:0}}>Check Inventory → Block Substitutions before the new week begins. Clear any that are no longer needed.</p>
                </div>
              );
            })()}

            {/* ── SUBMISSION BANNER ────────────────────────────────── */}
            {needsSubmission&&(
              <div style={{background:"#1a1a0a",border:"2px solid #c8860a",borderRadius:10,padding:"12px 16px",marginBottom:14}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
                  <div>
                    <p style={{margin:"0 0 2px",fontSize:13,color:"#c8860a",fontWeight:"bold"}}>📋 Submit last week's orders</p>
                    <p style={{margin:0,fontSize:11,color:"#5a8a5a"}}>Week of {lastWeekKey} · Update any values below then submit</p>
                  </div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    <button onClick={()=>{submitWeekOrders(lastWeekKey, orders);}} style={{...S.btn(),padding:"8px 16px",fontSize:13,fontWeight:"bold"}}>✓ Submit</button>
                    {getMissedWeeks().length>0&&<button onClick={()=>{setShowMissedWeek(p=>!p);setMissedWeekOrders(JSON.parse(JSON.stringify(orders)));}} style={{...S.btn("#3a3a1a"),border:"1px solid #c8860a",fontSize:11}}>Submit missed week</button>}
                  </div>
                </div>

                {/* Missed week panel */}
                {showMissedWeek&&(
                  <div style={{marginTop:12,padding:"10px 14px",background:"#0c0c0a",borderRadius:8,border:"1px solid #5a5a2a"}}>
                    <p style={{margin:"0 0 8px",fontSize:12,color:"#a8a850",fontWeight:"bold"}}>Which week are you submitting for?</p>
                    <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:10,flexWrap:"wrap"}}>
                      <input type="date" value={missedWeekDate||lastWeekKey}
                        onChange={e=>{
                          const wk = getWeekKey(e.target.value);
                          setMissedWeekDate(wk);
                          // Pre-fill with last submitted orders or current
                          const prev = orderHistory[wk];
                          if(prev) {
                            const filled = {};
                            clients.forEach(cl=>{ filled[cl.id]={}; species.forEach(sp=>{ if(prev[cl.id]?.[sp.id]) filled[cl.id][sp.id]=prev[cl.id][sp.id]; }); });
                            setMissedWeekOrders(filled);
                          } else {
                            setMissedWeekOrders(JSON.parse(JSON.stringify(orders)));
                          }
                        }}
                        style={{...S.inp,width:"auto",colorScheme:"dark"}}/>
                      <span style={{fontSize:11,color:"#5a5a3a"}}>Week starts: {missedWeekDate||lastWeekKey}</span>
                    </div>
                    <div style={{overflowX:"auto",marginBottom:10}}>
                      <table style={{borderCollapse:"collapse",width:"100%",fontSize:12}}>
                        <thead><tr><th style={S.thL}>Client</th>{species.map(sp=><th key={sp.id} style={S.th(sp.color)}>{sp.name}</th>)}</tr></thead>
                        <tbody>
                          {clients.map((cl,ci)=>(
                            <tr key={cl.id} style={S.row(ci)}>
                              <td style={{...S.td,textAlign:"left",color:"#a8c890",fontWeight:"bold",paddingLeft:8}}>{cl.name}</td>
                              {species.map(sp=>(
                                <td key={sp.id} style={S.td}>
                                  <input type="number" min="0" step="0.25"
                                    value={missedWeekOrders[cl.id]?.[sp.id]||""}
                                    onChange={e=>{
                                      const num=parseFloat(e.target.value)||0;
                                      const cid=cl.id; const sid=sp.id;
                                      setMissedWeekOrders(p=>{const c={...(p[cid]||{}),[sid]:num};return {...p,[cid]:c};});
                                    }}
                                    placeholder="—" style={S.numInp}/>
                                </td>
                              ))}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    <div style={{display:"flex",gap:8}}>
                      <button onClick={()=>{submitWeekOrders(missedWeekDate||lastWeekKey, missedWeekOrders);setShowMissedWeek(false);}} style={S.btn()}>✓ Submit Missed Week</button>
                      <button onClick={()=>setShowMissedWeek(false)} style={S.btn("#5a2a2a")}>Cancel</button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Baseline indicator */}
            {Object.keys(orderHistory).length > 0 && (
              <div style={{...S.box("#3a5a3a"),padding:"6px 12px",marginBottom:10}}>
                <p style={{margin:0,fontSize:11,color:"#5a8a5a"}}>
                  📊 Projections based on <strong style={{color:"#7ec8a0"}}>seasonally-adjusted 4-week average</strong> — smooths out week-to-week variation
                </p>
              </div>
            )}
            {/* This week's events banner */}
            {thisWeekEvents.length>0&&(
              <div style={{background:"#2a1a0a",border:"2px solid #f4d06f",borderRadius:10,padding:"12px 16px",marginBottom:14}}>
                <h3 style={{margin:"0 0 8px",color:"#f4d06f",fontSize:13}}>⚡ This Week's Events</h3>
                {thisWeekEvents.map(item=>{
                  const badge=typeBadge(item.type);
                  const daysUntil=dateToDayOffset(item.startDate);
                  return(
                    <div key={item.id} style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:4}}>
                      <span style={{background:badge.bg,border:`1px solid ${badge.border}`,color:badge.color,borderRadius:4,padding:"2px 7px",fontSize:11}}>{badge.label}</span>
                      <strong style={{color:"#f4d06f",fontSize:13}}>{item.name}</strong>
                      <span style={{color:"#a8c890",fontSize:11}}>{item.startDate}{item.endDate?` → ${item.endDate}`:""}</span>
                      {item.readyDaysBefore>0&&<span style={{color:"#5a8a5a",fontSize:10}}>({item.readyDaysBefore}d early prep)</span>}
                      <span style={{color:daysUntil<0?"#7ec8a0":daysUntil===0?"#f4d06f":"#e8a87c",fontSize:11,fontWeight:"bold"}}>
                        {daysUntil<0?`${Math.abs(daysUntil)}d in`:daysUntil===0?"TODAY":`in ${daysUntil}d`}
                      </span>
                    </div>
                  );
                })}
              </div>
            )}

            {/* Client orders table */}
            <div style={{...S.card,overflowX:"auto"}}>
              <table style={{borderCollapse:"collapse",width:"100%"}}>
                <thead>
                  <tr>
                    <th style={{...S.thL,position:"sticky",left:0,zIndex:2,background:"#1a2e1a",borderRight:"3px solid #3a5a3a"}}>Client</th>
                    {species.map(sp=><th key={sp.id} style={S.th(sp.color)}>{sp.name}<br/><span style={{fontSize:9,color:"#3a5a3a",fontWeight:"normal"}}>{sp.spawnWeeks}w·{sp.blockWeeks}w</span></th>)}
                    <th style={S.th("#5a8a5a")}>Status</th>
                    <th style={S.th("#a8c890")}>Lbs</th>
                    {pricingUnlocked&&<th style={S.th("#7ec8a0")}>$</th>}
                    <th style={S.th("#4a6a9a")}>⇄</th>
                  </tr>
                </thead>
                <tbody>
                  {(()=>{
                    const restaurants = [...clients].filter(cl=>cl.clientType!=="market").sort((a,b)=>a.name.localeCompare(b.name));
                    const markets = [...clients].filter(cl=>cl.clientType==="market").sort((a,b)=>a.name.localeCompare(b.name));
                    const allRows = [...restaurants, ...(markets.length>0?[{_divider:true},...markets]:[])];
                    let ci = 0;
                    return allRows.map((cl,i)=>{
                      if(cl._divider) return(
                        <tr key="divider">
                          <td colSpan={species.length+3+(pricingUnlocked?1:0)}
                            style={{padding:"6px 10px",background:"#0c160c",color:"#3a5a3a",fontSize:10,fontWeight:"bold",borderTop:"2px solid #2d4a2d",borderBottom:"1px solid #2d4a2d",letterSpacing:1}}>
                            🏪 MARKETS
                          </td>
                        </tr>
                      );
                      const rowIdx = ci++;
                      const isNew = cl.addedDate && cl.startDate;
                      const startOffset = cl.startDate ? dateToDayOffset(cl.startDate) : null;
                      const highlighted = isNew && startOffset !== null && startOffset >= -5;
                      const statusLabel = isNew && startOffset !== null
                        ? (startOffset > 0 ? `Starts ${dateLabel(cl.startDate)}` : startOffset >= -5 ? `Started ${dateLabel(cl.startDate)} ✨` : "Continued")
                        : "Continued";
                      const statusColor = highlighted ? "#f4d06f" : "#3a5a3a";
                      const rev = clientWeeklyRevenue(cl);
                      const totalLbsRow = r2(species.reduce((s,sp)=>s+(parseFloat(orders[cl.id]?.[sp.id]??0)||0),0));
                      return(
                        <tr key={cl.id} style={{background:highlighted?"#2a1e0a":rowIdx%2===0?"#0c160c":"#111e11",outline:highlighted?"1px solid #f4d06f44":"none"}}>
                          <td style={{...S.td,textAlign:"left",color:highlighted?"#f4d06f":"#a8c890",fontWeight:"bold",paddingLeft:10,position:"sticky",left:0,zIndex:1,background:highlighted?"#2a1e0a":rowIdx%2===0?"#0c160c":"#111e11",borderRight:"3px solid #3a5a3a"}}>{cl.name}</td>
                          {species.map(sp=><td key={sp.id} style={S.td}><input type="number" min="0" step="0.25" value={getOrd(cl.id,sp.id)} onChange={e=>setOrd(cl.id,sp.id,e.target.value)} placeholder="—" style={S.numInp}/></td>)}
                          <td style={{...S.td,fontSize:10,color:statusColor,whiteSpace:"nowrap"}}>{statusLabel}</td>
                          <td style={{...S.td,fontSize:11,color:"#a8c890",fontWeight:"bold",whiteSpace:"nowrap"}}>{totalLbsRow>0?fmt(totalLbsRow):"—"}</td>
                          {pricingUnlocked&&<td style={{...S.td,fontSize:12,color:"#7ec8a0",fontWeight:"bold",whiteSpace:"nowrap"}}>${fmt(rev)}</td>}
                          <td style={S.td}>
                            <button onClick={()=>{
                              setMenuChangeClient(cl);
                              setMenuChangeDate(todayStr());
                              setMenuChangeApplied(false);
                              const cur={};
                              species.forEach(sp=>{const lbs=parseFloat(orders[cl.id]?.[sp.id]??0)||0;if(lbs>0)cur[sp.id]=lbs;});
                              setMenuChangeNew(cur);
                            }} style={{...S.btn("#2a3a5a"),padding:"2px 8px",fontSize:11,border:"1px solid #4a6a9a"}} title="Menu change">⇄</button>
                          </td>
                        </tr>
                      );
                    });
                  })()}
                  <tr style={{borderTop:"2px solid #3a5a3a",background:"#1a2e1a"}}>
                    <td style={{...S.td,textAlign:"left",color:"#7ec8a0",fontWeight:"bold",paddingLeft:10,position:"sticky",left:0,zIndex:1,background:"#1a2e1a",borderRight:"3px solid #3a5a3a"}}>Total</td>
                    {spTotals.map(sp=><td key={sp.id} style={S.tdn(sp.color,sp.lbs===0)}>{sp.lbs>0?fmt(sp.lbs):"—"}</td>)}
                    <td></td>
                    <td style={{...S.td,color:"#a8c890",fontWeight:"bold",fontSize:12}}>{fmt(spTotals.reduce((s,sp)=>s+(sp.lbs||0),0))} lbs</td>
                    {pricingUnlocked&&<td style={{...S.td,color:"#7ec8a0",fontWeight:"bold",fontSize:12}}>${fmt(clients.reduce((sum,cl)=>r2(sum+clientWeeklyRevenue(cl)),0))}</td>}
                  </tr>
                </tbody>
              </table>
            </div>

            {/* ── MENU CHANGE PANEL ────────────────────────────────────── */}
            {menuChangeClient&&(()=>{
              const cl = menuChangeClient;
              const changeOffset = dateToDayOffset(menuChangeDate);
              // Analyze new menu items vs current
              const dropping = species.filter(sp=>{
                const wasOrdering=(parseFloat(orders[cl.id]?.[sp.id]??0)||0)>0;
                const stillOrdering=(menuChangeNew[sp.id]||0)>0;
                return wasOrdering&&!stillOrdering;
              });
              const adding = species.filter(sp=>{
                const wasOrdering=(parseFloat(orders[cl.id]?.[sp.id]??0)||0)>0;
                const newLbs=menuChangeNew[sp.id]||0;
                return newLbs>0&&(!wasOrdering||(menuChangeNew[sp.id]!==(parseFloat(orders[cl.id]?.[sp.id]??0)||0)));
              });
              // For each new species — can it be ready by change date?
              const readyAnalysis = adding.map(sp=>{
                const lbs = menuChangeNew[sp.id]||0;
                const weeksNeeded = sp.blockWeeks;
                const canMeet = changeOffset >= weeksNeeded*7;
                const earliestDays = weeksNeeded*7;
                const shortfall = Math.max(0, earliestDays - changeOffset);
                const weeksShort = Math.ceil(shortfall/7);
                const bankData = simplBank[sp.id];
                const bankBlocks = bankData?.inHandBlocks||0;
                const blocksNeeded = r2(lbs/sp.blockDivisor);
                const bankCovers = bankBlocks>=blocksNeeded;
                // Possible subs: species ready in time
                const subs = species.filter(s=>s.id!==sp.id&&s.blockWeeks*7<=changeOffset&&s.id!==cl.id);
                return {sp,lbs,canMeet,weeksShort,bankCovers,bankBlocks,blocksNeeded,subs};
              });
              // Winding down — blocks already in progress
              const windDown = dropping.map(sp=>{
                const bankData=simplBank[sp.id];
                return {sp,inBank:bankData?.inHandBlocks||0};
              });
              return(
                <div style={{...S.card,borderLeft:"4px solid #4a6a9a",marginBottom:12}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                    <div>
                      <h3 style={{margin:"0 0 2px",color:"#6b9ada",fontSize:14}}>⇄ Menu Change — {cl.name}</h3>
                      {menuChangeApplied
                        ? <p style={{margin:0,fontSize:11,color:"#7ec8a0",fontWeight:"bold"}}>✓ Applied — orders updated. Review transition plan below.</p>
                        : <p style={{margin:0,fontSize:11,color:"#5a8a5a"}}>Enter the new menu and effective date</p>}
                    </div>
                    <button onClick={()=>setMenuChangeClient(null)} style={{...S.btn("#5a2a2a"),padding:"2px 8px",fontSize:11}}>✕</button>
                  </div>

                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                    <div>
                      <label style={S.fieldLabel}>Effective date</label>
                      <input type="date" value={menuChangeDate} onChange={e=>setMenuChangeDate(e.target.value)} style={{...S.inp,colorScheme:"dark"}}/>
                    </div>
                  </div>

                  <label style={{...S.fieldLabel,marginBottom:6}}>New menu (lbs/week per species — leave blank to drop):</label>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:14}}>
                    {species.map(sp=>{
                      const cur=parseFloat(orders[cl.id]?.[sp.id]??0)||0;
                      const nw=menuChangeNew[sp.id]||0;
                      const changed=nw!==cur;
                      return(
                        <div key={sp.id} style={{textAlign:"center"}}>
                          <label style={{fontSize:9,color:sp.color,display:"block",marginBottom:1}}>{sp.name}{cur>0&&<span style={{color:"#3a5a3a"}}> ({cur})</span>}</label>
                          <input type="number" min="0" step="0.25" value={menuChangeNew[sp.id]||""}
                            onChange={e=>{const num=parseFloat(e.target.value)||0;setMenuChangeNew(p=>({...p,[sp.id]:num}));}}
                            placeholder="—" style={{...S.numInp,borderColor:changed?"#f4d06f":"#2d4a2d"}}/>
                        </div>
                      );
                    })}
                  </div>

                  {readyAnalysis.length>0&&(
                    <div style={{marginBottom:12}}>
                      <p style={{margin:"0 0 8px",fontSize:11,color:"#a8c890",fontWeight:"bold"}}>NEW MENU</p>
                      {readyAnalysis.map(r=>(
                        <div key={r.sp.id} style={{background:"#0c160c",borderRadius:6,padding:"8px 12px",marginBottom:6,borderLeft:`3px solid ${r.sp.color}`}}>
                          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                            <span style={{color:r.sp.color,fontWeight:"bold"}}>{r.sp.name}</span>
                            <span style={{color:"#5a8a5a",fontSize:11}}>{r.lbs} lbs/wk</span>
                            {r.canMeet
                              ?<span style={{color:"#7ec8a0",fontSize:11,fontWeight:"bold"}}>✅ Ready by {menuChangeDate}</span>
                              :<span style={{color:"#e07b8a",fontSize:11,fontWeight:"bold"}}>⚠️ {r.weeksShort} wk{r.weeksShort!==1?"s":""} behind — earliest {daysLabel(r.sp.blockWeeks*7)}</span>}
                            {r.bankCovers&&<span style={{color:"#7ec8a0",fontSize:10}}>✓ bank covers first delivery</span>}
                          </div>
                          {!r.canMeet&&r.subs.length>0&&(
                            <div style={{marginTop:6,fontSize:10,color:"#5a8a5a"}}>
                              Sub until ready: {r.subs.slice(0,3).map(s=>{
                                const sb=simplBank[s.id];
                                return <span key={s.id} style={{color:s.color,marginRight:8}}>{s.name}{sb?.inHandBlocks>0?` (+${fmt(sb.inHandBlocks)} in bank)`:""}</span>;
                              })}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}

                  {windDown.length>0&&(
                    <div style={{marginBottom:12}}>
                      <p style={{margin:"0 0 8px",fontSize:11,color:"#e07b8a",fontWeight:"bold"}}>WINDING DOWN</p>
                      {windDown.map(w=>(
                        <div key={w.sp.id} style={{background:"#1a0a0a",borderRadius:6,padding:"7px 12px",marginBottom:5,borderLeft:`3px solid ${w.sp.color}`}}>
                          <span style={{color:w.sp.color,fontWeight:"bold"}}>{w.sp.name}</span>
                          <span style={{color:"#5a8a5a",fontSize:11,marginLeft:8}}>Stop new batches immediately</span>
                          {w.inBank>0&&<span style={{color:"#a8c890",fontSize:11,marginLeft:8}}>{fmt(w.inBank)} blocks in bank → offer to other clients or market</span>}
                        </div>
                      ))}
                    </div>
                  )}

                  <button onClick={()=>{
                    const newOrds={...orders,[cl.id]:{}};
                    species.forEach(sp=>{if(menuChangeNew[sp.id]>0)newOrds[cl.id][sp.id]=menuChangeNew[sp.id];});
                    setOrders(newOrds);
                    setMenuChangeApplied(true);
                    // Save to persistent menu changes list
                    const oldMenu={};
                    species.forEach(sp=>{const lbs=parseFloat(orders[cl.id]?.[sp.id]??0)||0;if(lbs>0)oldMenu[sp.id]=lbs;});
                    setMenuChanges(p=>[...p.filter(m=>m.clientId!==cl.id),{
                      id:Date.now(), clientId:cl.id, clientName:cl.name,
                      effectiveDate:menuChangeDate,
                      oldMenu, newMenu:{...menuChangeNew},
                      addedDate:todayStr(),
                    }]);
                  }} style={{...S.btn(),marginRight:8}}>✓ Apply Menu Change</button>
                  <button onClick={()=>{setMenuChangeClient(null);setMenuChangeApplied(false);}} style={S.btn("#5a2a2a")}>✕ Close</button>
                </div>
              );
            })()}

            {/* ── UPCOMING SECTION ─────────────────────────────────────── */}
            <div style={{borderTop:"2px solid #2d4a2d",paddingTop:14,marginTop:4}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                <h2 style={{margin:0,color:"#7ec8a0",fontSize:14}}>Upcoming Events, Markets & Clients</h2>
                <button onClick={()=>{setShowAddUp(p=>!p);setEditingUpId(null);setNewUp({type:"event",name:"",startDate:todayStr(),endDate:"",readyDaysBefore:0,orders:{}});}} style={S.btn()}>
                  {showAddUp&&!editingUpId?"✕ Cancel":"+ Add"}
                </button>
              </div>

              {/* Add / Edit form */}
              {showAddUp&&(
                <div style={S.card}>
                  <h3 style={{margin:"0 0 10px",color:"#7ec8a0",fontSize:13}}>{editingUpId?"Edit Item":"Add New"}</h3>
                  <div style={{display:"flex",gap:8,marginBottom:12}}>
                    {["event","market","client"].map(type=>{
                      const badge=typeBadge(type);
                      return <button key={type} onClick={()=>setNewUp(p=>({...p,type}))} style={{...S.btn(newUp.type===type?badge.color+"44":"#1a2e1a"),border:`1px solid ${badge.border}`,color:badge.color,fontSize:11}}>{badge.label}</button>;
                    })}
                  </div>
                  <div style={{marginBottom:10}}>
                    <label style={S.fieldLabel}>Name</label>
                    <input value={newUp.name} onChange={e=>setNewUp(p=>({...p,name:e.target.value}))}
                      placeholder={newUp.type==="event"?"e.g. Harvest Festival":newUp.type==="market"?"e.g. Cambridge Farmers Market":"e.g. Bistro 42"}
                      style={{...S.inp,width:"100%",fontSize:14}}/>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:12}}>
                    <div>
                      <label style={S.fieldLabel}>{newUp.type==="market"?"Start date":"Date"}</label>
                      <input type="date" value={newUp.startDate} onChange={e=>setNewUp(p=>({...p,startDate:e.target.value}))} style={{...S.inp,colorScheme:"dark"}}/>
                    </div>
                    {newUp.type==="market"&&(
                      <div>
                        <label style={S.fieldLabel}>End date</label>
                        <input type="date" value={newUp.endDate} onChange={e=>setNewUp(p=>({...p,endDate:e.target.value}))} style={{...S.inp,colorScheme:"dark"}}/>
                      </div>
                    )}
                    <div>
                      <label style={S.fieldLabel}>Ready days before event</label>
                      <input type="number" min="0" max="14" value={newUp.readyDaysBefore}
                        onChange={e=>setNewUp(p=>({...p,readyDaysBefore:parseInt(e.target.value)||0}))}
                        style={S.numInp}/>
                    </div>
                  </div>
                  <label style={{...S.fieldLabel,marginBottom:8}}>Expected lbs per species {newUp.type==="market"?"(per week)":""}:</label>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(88px,1fr))",gap:8,marginBottom:12}}>
                    {species.map(sp=>(
                      <div key={sp.id} style={{textAlign:"center"}}>
                        <label style={{fontSize:10,color:sp.color,display:"block",marginBottom:2}}>{sp.name}</label>
                        <input type="number" min="0" step="0.25" value={newUp.orders[sp.id]||""} onChange={e=>{const num=e.target.value===""?undefined:parseFloat(e.target.value)||0;setNewUp(p=>({...p,orders:{...p.orders,[sp.id]:num}}));setShowClientQuote("upcoming");}} placeholder="—" style={S.numInp}/>

                  </div>
                </div>
              )}

              {sortedUpcoming.length===0&&!showAddUp&&<div style={{color:"#3a5a3a",fontSize:12,padding:"8px 0"}}>No upcoming items yet — tap + Add to get started.</div>}

              {sortedUpcoming.length>0&&(
                <div style={{...S.card,overflowX:"auto"}}>
                  <table style={{borderCollapse:"collapse",width:"100%"}}>
                    <thead>
                      <tr>
                        <th style={{...S.thL,position:"sticky",left:0,zIndex:2,background:"#1a2e1a",borderRight:"3px solid #3a5a3a"}}>Name / Type</th>
                        {species.map(sp=><th key={sp.id} style={S.th(sp.color)}>{sp.name}</th>)}
                        <th style={{...S.thL,minWidth:140,textAlign:"right",borderBottom:"2px solid #2d4a2d"}}>Dates</th>
                        <th style={S.th()}></th>
                      </tr>
                    </thead>
                    <tbody>
                      {sortedUpcoming.map((item,ii)=>{
                        const badge=typeBadge(item.type);
                        const highlight=itemHighlight(item);
                        const daysUntil=dateToDayOffset(item.startDate);
                        return(
                          <tr key={item.id} style={{background:highlight?"#2a1e0a":ii%2===0?"#0c160c":"#111e11",borderBottom:"1px solid #1a2e1a",outline:highlight?"1px solid #f4d06f44":"none"}}>
                            <td style={{...S.td,textAlign:"left",paddingLeft:8,paddingTop:8,paddingBottom:6,position:"sticky",left:0,zIndex:1,background:highlight?"#2a1e0a":ii%2===0?"#0c160c":"#111e11",borderRight:"3px solid #3a5a3a"}}>
                              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                                <span style={{color:badge.color,fontWeight:"bold",fontSize:13}}>{item.name}</span>
                                <span style={{background:badge.bg,border:`1px solid ${badge.border}`,color:badge.color,borderRadius:3,padding:"1px 5px",fontSize:9}}>{badge.label}</span>
                                {highlight&&<span style={{color:"#f4d06f",fontSize:10,fontWeight:"bold"}}>⚡ {daysUntil<=0?"ACTIVE":`in ${daysUntil}d`}</span>}
                                {item.readyDaysBefore>0&&<span style={{color:"#5a8a5a",fontSize:9}}>{item.readyDaysBefore}d prep</span>}
                              </div>
                            </td>
                            {species.map(sp=><td key={sp.id} style={S.tdn(item.orders?.[sp.id]>0?badge.color:"#2d4a2d",!item.orders?.[sp.id])}>{item.orders?.[sp.id]>0?fmt(item.orders[sp.id]):"—"}</td>)}
                            <td style={{...S.td,textAlign:"right",paddingRight:8,fontSize:11,color:"#a8c890",whiteSpace:"nowrap"}}>
                              {item.startDate}{item.endDate&&<span style={{color:"#5a8a5a",display:"block"}}>→ {item.endDate}</span>}
                            </td>
                            <td style={{...S.td,whiteSpace:"nowrap"}}>
                              <button onClick={()=>startEdit(item)} style={{...S.btn("#2a4a2a"),padding:"2px 6px",fontSize:10,marginRight:4}}>✏️</button>
                              <button onClick={()=>{if(window.confirm(`Remove "${item.name}"? This cannot be undone.`))setUpcoming(p=>p.filter(u=>u.id!==item.id));}} style={{...S.btn("#5a2a2a"),padding:"2px 7px",fontSize:11}}>✕</button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>

            {/* ── ACTIVE MENU CHANGES ───────────────────────────────────── */}
            {menuChanges.length>0&&(
              <div style={{borderTop:"2px solid #2d4a2d",paddingTop:14,marginTop:4}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                  <h2 style={{margin:0,color:"#6b9ada",fontSize:14}}>⇄ Active Menu Changes</h2>
                </div>
                {menuChanges.map(mc=>{
                  const cl = clients.find(c=>c.id===mc.clientId);
                  if(!cl) return null;
                  const changeOffset = dateToDayOffset(mc.effectiveDate);

                  const dropping = species.filter(sp=>(mc.oldMenu[sp.id]||0)>0&&!(mc.newMenu[sp.id]||0)>0);
                  const adding = species.filter(sp=>(mc.newMenu[sp.id]||0)>0);

                  const readyAnalysis = adding.map(sp=>{
                    const lbs = mc.newMenu[sp.id]||0;
                    const canMeet = changeOffset >= sp.blockWeeks*7;
                    const weeksShort = Math.max(0,Math.ceil((sp.blockWeeks*7-changeOffset)/7));
                    const bankData = simplBank[sp.id];
                    const bankBlocks = bankData?.inHandBlocks||0;
                    const blocksNeeded = r2(lbs/sp.blockDivisor);
                    const bankCovers = bankBlocks>=blocksNeeded;
                    const subs = species.filter(s=>s.id!==sp.id&&s.blockWeeks*7<=changeOffset);
                    return {sp,lbs,canMeet,weeksShort,bankCovers,bankBlocks,blocksNeeded,subs};
                  });

                  const windDown = dropping.map(sp=>({sp, inBank:simplBank[sp.id]?.inHandBlocks||0}));

                  return(
                    <div key={mc.id} style={{...S.card,borderLeft:"4px solid #4a6a9a",marginBottom:8,padding:0,overflow:"hidden"}}>
                      {/* Header — always visible, tap to expand */}
                      <div onClick={()=>setExpandedMenuChanges(p=>({...p,[mc.id]:!p[mc.id]}))}
                        style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",cursor:"pointer",background:"#1a2e1a"}}>
                        <div style={{flex:1}}>
                          <span style={{color:"#6b9ada",fontWeight:"bold",fontSize:13}}>⇄ {mc.clientName}</span>
                          <span style={{color:"#5a8a5a",fontSize:11,marginLeft:8}}>Effective {mc.effectiveDate}</span>
                        </div>
                        <span style={{color:"#5a8a5a",fontSize:11}}>{expandedMenuChanges[mc.id]?"▲":"▼"}</span>
                      </div>

                      {/* Expanded content */}
                      {expandedMenuChanges[mc.id]&&(
                      <div style={{padding:"10px 14px",borderTop:"1px solid #2d4a2d"}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:8}}>
                        <p style={{margin:0,fontSize:11,color:"#5a8a5a"}}>Applied {mc.addedDate}</p>
                        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                          {editingMenuChangeId!==mc.id&&(
                            <button onClick={()=>{
                              setEditingMenuChangeId(mc.id);
                              setEditMenuNew({...mc.newMenu});
                            }} style={{...S.btn("#2a3a5a"),padding:"2px 8px",fontSize:11,border:"1px solid #4a6a9a"}}>✏️ Edit</button>
                          )}
                          {editingMenuChangeId===mc.id&&(
                            <>
                              <button onClick={()=>{
                                const newOrds={...orders,[mc.clientId]:{}};
                                species.forEach(sp=>{if(editMenuNew[sp.id]>0)newOrds[mc.clientId][sp.id]=editMenuNew[sp.id];});
                                setOrders(newOrds);
                                setMenuChanges(p=>p.map(m=>m.id===mc.id?{...m,newMenu:{...editMenuNew}}:m));
                                setEditingMenuChangeId(null);
                              }} style={{...S.btn(),padding:"2px 8px",fontSize:11}}>✓ Save</button>
                              <button onClick={()=>setEditingMenuChangeId(null)} style={{...S.btn("#5a2a2a"),padding:"2px 8px",fontSize:11}}>Cancel</button>
                            </>
                          )}
                          <button onClick={()=>{
                            if(window.confirm(`Revert ${mc.clientName} back to their old menu? This will undo the menu change.`)){
                              const reverted={...orders,[mc.clientId]:{}};
                              species.forEach(sp=>{if(mc.oldMenu[sp.id]>0)reverted[mc.clientId][sp.id]=mc.oldMenu[sp.id];});
                              setOrders(reverted);
                              setMenuChanges(p=>p.filter(m=>m.id!==mc.id));
                            }
                          }} style={{...S.btn("#5a1a1a"),padding:"2px 8px",fontSize:11,border:"1px solid #8a3a3a"}}>↩ Revert</button>
                          <button onClick={()=>{if(window.confirm(`Dismiss menu change for ${mc.clientName}? The orders have already been applied.`))setMenuChanges(p=>p.filter(m=>m.id!==mc.id));}}
                            style={{...S.btn("#5a2a2a"),padding:"2px 8px",fontSize:11}}>✕ Dismiss</button>
                        </div>
                      </div>

                      {/* Edit panel */}
                      {editingMenuChangeId===mc.id&&(
                        <div style={{background:"#0c160c",borderRadius:8,padding:"10px 12px",marginBottom:12,border:"1px solid #2d4a2d"}}>
                          <p style={{margin:"0 0 8px",fontSize:11,color:"#a8c890",fontWeight:"bold"}}>Edit new menu (lbs/week):</p>
                          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
                            {species.map(sp=>(
                              <div key={sp.id} style={{textAlign:"center"}}>
                                <label style={{fontSize:9,color:sp.color,display:"block",marginBottom:1}}>{sp.name}</label>
                                <input type="number" min="0" step="0.25"
                                  value={editMenuNew[sp.id]||""}
                                  onChange={e=>{const num=parseFloat(e.target.value)||0;setEditMenuNew(p=>({...p,[sp.id]:num}));}}
                                  placeholder="—" style={S.numInp}/>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {readyAnalysis.length>0&&(
                        <div style={{marginBottom:10}}>
                          <p style={{margin:"0 0 6px",fontSize:11,color:"#a8c890",fontWeight:"bold",letterSpacing:1}}>NEW MENU</p>
                          {readyAnalysis.map(r=>(
                            <div key={r.sp.id} style={{background:"#0c160c",borderRadius:6,padding:"7px 12px",marginBottom:5,borderLeft:`3px solid ${r.sp.color}`}}>
                              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                                <span style={{color:r.sp.color,fontWeight:"bold"}}>{r.sp.name}</span>
                                <span style={{color:"#5a8a5a",fontSize:11}}>{r.lbs} lbs/wk</span>
                                {r.canMeet
                                  ?<span style={{color:"#7ec8a0",fontSize:11,fontWeight:"bold"}}>✅ Ready by {mc.effectiveDate}</span>
                                  :<span style={{color:"#e07b8a",fontSize:11,fontWeight:"bold"}}>⚠️ {r.weeksShort} wk{r.weeksShort!==1?"s":""} behind — earliest {daysLabel(r.sp.blockWeeks*7)}</span>}
                                {r.bankCovers&&<span style={{color:"#7ec8a0",fontSize:10}}>✓ bank covers gap</span>}
                              </div>
                              {!r.canMeet&&r.subs.length>0&&(
                                <div style={{marginTop:5,fontSize:10,color:"#5a8a5a"}}>
                                  Sub until ready: {r.subs.slice(0,3).map(s=>{
                                    const sb=simplBank[s.id];
                                    return <span key={s.id} style={{color:s.color,marginRight:8}}>{s.name}{sb?.inHandBlocks>0?` (+${fmt(sb.inHandBlocks)} blks)`:""}</span>;
                                  })}
                                </div>
                              )}
                              {!r.canMeet&&r.subs.length===0&&(
                                <div style={{marginTop:5,fontSize:10,color:"#e07b8a"}}>No species can be ready in time — check bank for available substitutes</div>
                              )}
                            </div>
                          ))}
                        </div>
                      )}

                      {windDown.length>0&&(
                        <div>
                          <p style={{margin:"0 0 6px",fontSize:11,color:"#e07b8a",fontWeight:"bold",letterSpacing:1}}>WINDING DOWN</p>
                          {windDown.map(w=>(
                            <div key={w.sp.id} style={{background:"#1a0a0a",borderRadius:6,padding:"7px 12px",marginBottom:5,borderLeft:`3px solid ${w.sp.color}`}}>
                              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                                <span style={{color:w.sp.color,fontWeight:"bold"}}>{w.sp.name}</span>
                                <span style={{color:"#5a8a5a",fontSize:11}}>Stop new batches immediately</span>
                                {w.inBank>0&&<span style={{color:"#a8c890",fontSize:11}}>{fmt(w.inBank)} blocks in bank → offer elsewhere</span>}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                      </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* ── SUPPLIERS ───────────────────────────────────────────────────────── */}
        {activeTab==="suppliers"&&(
          <div>
            <h3 style={{color:"#7ec8a0",marginTop:0,fontSize:14,marginBottom:12}}>🤝 Suppliers</h3>

            {/* Add supplier form */}
            <div style={S.card}>
              <h4 style={{margin:"0 0 10px",color:"#a8c890",fontSize:12}}>Add Supplier</h4>
              <div style={{marginBottom:8}}>
                <label style={S.fieldLabel}>Supplier name</label>
                <input value={newSupplier.name} onChange={e=>setNewSupplier(p=>({...p,name:e.target.value}))}
                  placeholder="e.g. Partner Farm" style={{...S.inp,width:"100%",fontSize:14}}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:8,marginBottom:8}}>
                <div>
                  <label style={S.fieldLabel}>Email</label>
                  <input value={newSupplier.email} onChange={e=>setNewSupplier(p=>({...p,email:e.target.value}))}
                    placeholder="supplier@email.com" style={{...S.inp,fontSize:12}}/>
                </div>
                <div>
                  <label style={S.fieldLabel}>Lead time (days)</label>
                  <input type="number" min="1" value={newSupplier.leadDays||7}
                    onChange={e=>setNewSupplier(p=>({...p,leadDays:parseInt(e.target.value)||7}))}
                    style={{...S.inp,fontSize:12}}/>
                </div>
              </div>
              <label style={{...S.fieldLabel,marginBottom:6}}>What do they supply? (type to search)</label>
              <div style={{marginBottom:10}}>
                {["Blocks","Grain spawn","Fresh mushrooms","Culture plates","Substrate","Filter patch bags","Jars","Lids","Pressure cooker liners","Liquid culture syringes","Agar plates","Grow bags","Sawdust","Bran supplement","Gypsum","Straw","Cardboard","Coco coir","Coffee grounds"].map(item=>{
                  const selected = (newSupplier.supplies||[]).includes(item);
                  return(
                    <button key={item} onClick={()=>setNewSupplier(p=>({...p,supplies:selected?p.supplies.filter(s=>s!==item):[...(p.supplies||[]),item]}))}
                      style={{...S.btn(selected?"#1a3a1a":"#1a2e1a"),border:`1px solid ${selected?"#7ec8a0":"#2d4a2d"}`,color:selected?"#7ec8a0":"#5a8a5a",fontSize:10,padding:"3px 8px",margin:"2px",borderRadius:4}}>
                      {item}
                    </button>
                  );
                })}
              </div>
              {(newSupplier.supplies||[]).includes("Blocks")&&(
                <div style={{background:"#0c160c",borderRadius:8,padding:"10px 12px",marginBottom:10,border:"1px solid #2d4a2d"}}>
                  <label style={{...S.fieldLabel,marginBottom:6}}>Which block species do they supply? Set delivery incubation level:</label>
                  {species.map(sp=>{
                    const weeksInIncub = Math.round(((sp.blockWeeks*7)-sp.fruitDays)/7);
                    const delivWeeks = newSupplier.blockSpecies?.[sp.id];
                    const selected = delivWeeks!==undefined;
                    return(
                      <div key={sp.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
                        <button onClick={()=>setNewSupplier(p=>{
                          const bs={...(p.blockSpecies||{})};
                          if(selected) delete bs[sp.id]; else bs[sp.id]=14;
                          return {...p,blockSpecies:bs};
                        })} style={{...S.btn(selected?"#1a3a1a":"#1a2e1a"),border:`1px solid ${selected?"#7ec8a0":"#2d4a2d"}`,color:selected?"#7ec8a0":"#5a8a5a",fontSize:11,padding:"3px 10px",minWidth:80}}>
                          {sp.name}
                        </button>
                        {selected&&(
                          <div style={{display:"flex",alignItems:"center",gap:6,flex:1}}>
                            <span style={{fontSize:10,color:"#5a8a5a"}}>Delivered at</span>
                            <input type="number" min="0" max={weeksInIncub*7} step="1"
                              value={delivWeeks||14}
                              onChange={e=>setNewSupplier(p=>({...p,blockSpecies:{...p.blockSpecies,[sp.id]:parseInt(e.target.value)||0}}))}
                              style={{...S.numInp,width:50}}/>
                            <span style={{fontSize:10,color:"#5a8a5a"}}>days incubated (of {weeksInIncub*7} total) → {Math.max(0,weeksInIncub*7-(delivWeeks||14))} days in your incubation room</span>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
              {(newSupplier.supplies||[]).includes("Fresh mushrooms")&&(
                <div style={{background:"#0c1a0c",borderRadius:8,padding:"10px 12px",marginBottom:10,border:"1px solid #2d4a2d"}}>
                  <label style={{...S.fieldLabel,marginBottom:6}}>🍄 Which species fresh? Set stock or grow-to-order:</label>
                  {species.map(sp=>{
                    const freshData = newSupplier.freshSpecies?.[sp.id];
                    const selected = freshData!==undefined;
                    const totalLeadDays = (getBlockIncubDays(sp) + sp.fruitDays + (newSupplier.leadDays||7));
                    return(
                      <div key={sp.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
                        <button onClick={()=>setNewSupplier(p=>{
                          const fs={...(p.freshSpecies||{})};
                          if(selected) delete fs[sp.id]; else fs[sp.id]="grow";
                          return {...p,freshSpecies:fs};
                        })} style={{...S.btn(selected?"#1a3a1a":"#1a2e1a"),border:`1px solid ${selected?"#7ec8a0":"#2d4a2d"}`,color:selected?"#7ec8a0":"#5a8a5a",fontSize:11,padding:"3px 10px",minWidth:80}}>
                          {sp.name}
                        </button>
                        {selected&&(
                          <div style={{display:"flex",alignItems:"center",gap:6,flex:1,flexWrap:"wrap"}}>
                            <select value={freshData}
                              onChange={e=>setNewSupplier(p=>({...p,freshSpecies:{...p.freshSpecies,[sp.id]:e.target.value}}))}
                              style={{...S.inp,width:"auto",fontSize:11}}>
                              <option value="grow">Grow to order</option>
                              <option value="stock">From stock</option>
                            </select>
                            <span style={{fontSize:10,color:"#5a8a5a"}}>
                              {freshData==="grow"
                                ? `${totalLeadDays}d lead (${getBlockIncubDays(sp)}d incub + ${sp.fruitDays}d fruit + ${newSupplier.leadDays||7}d delivery)`
                                : `${newSupplier.leadDays||7}d lead (from stock)`}
                            </span>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
              <button onClick={()=>{
                if(!newSupplier.name.trim()) return;
                setSuppliers(p=>[...p,{...newSupplier,id:Date.now()}]);
                setNewSupplier({name:'',email:'',leadDays:7,supplies:[],blockSpecies:{},freshSpecies:{}});
              }} style={{...S.btn(),marginTop:4}}>+ Add Supplier</button>
            </div>

            {/* Supplier list */}
            {suppliers.length===0&&(
              <div style={{...S.card,textAlign:"center",color:"#5a8a5a"}}>No suppliers yet — add one above.</div>
            )}
            {suppliers.map(sup=>{
              const isExpanded = expandedSupplier===sup.id;
              return(
                <div key={sup.id} style={{...S.card,padding:0,overflow:"hidden",marginBottom:8}}>
                  <div onClick={()=>setExpandedSupplier(isExpanded?null:sup.id)}
                    style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",cursor:"pointer",background:"#1a2e1a"}}>
                    <strong style={{color:"#d4e8c2",fontSize:13,flex:1}}>{sup.name}</strong>
                    {sup.email&&<span style={{fontSize:10,color:"#5a8a5a"}}>{sup.email}</span>}
                    <span style={{fontSize:10,color:"#5a8a5a"}}>{sup.leadDays||7}d lead</span>
                    <button onClick={e=>{e.stopPropagation();if(window.confirm(`Remove ${sup.name}?`))setSuppliers(p=>p.filter(s=>s.id!==sup.id));}}
                      style={{...S.btn("#5a2a2a"),padding:"2px 7px",fontSize:10}}>✕</button>
                    <span style={{fontSize:11,color:"#5a8a5a"}}>{isExpanded?"▲":"▼"}</span>
                  </div>
                  {isExpanded&&(
                    <div style={{padding:"10px 14px",borderTop:"1px solid #2d4a2d",background:"#0c160c"}}>
                      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:8,marginBottom:10}}>
                        <div>
                          <label style={S.fieldLabel}>Email</label>
                          <input value={sup.email||""} onChange={e=>setSuppliers(p=>p.map(s=>s.id===sup.id?{...s,email:e.target.value}:s))}
                            style={{...S.inp,fontSize:12}}/>
                        </div>
                        <div>
                          <label style={S.fieldLabel}>Lead time (days)</label>
                          <input type="number" min="1" value={sup.leadDays||7}
                            onChange={e=>setSuppliers(p=>p.map(s=>s.id===sup.id?{...s,leadDays:parseInt(e.target.value)||7}:s))}
                            style={{...S.inp,fontSize:12}}/>
                        </div>
                      </div>
                      <label style={{...S.fieldLabel,marginBottom:6}}>Supplies:</label>
                      <div style={{marginBottom:10,display:"flex",flexWrap:"wrap",gap:4}}>
                        {(sup.supplies||[]).map(item=>(
                          <span key={item} style={{fontSize:10,color:"#7ec8a0",background:"#1a3a1a",border:"1px solid #2d5a2d",borderRadius:4,padding:"2px 8px"}}>{item}</span>
                        ))}
                        {(sup.supplies||[]).length===0&&<span style={{fontSize:10,color:"#5a8a5a"}}>None selected</span>}
                      </div>
                      {(sup.supplies||[]).includes("Blocks")&&Object.keys(sup.blockSpecies||{}).length>0&&(
                        <div>
                          <label style={{...S.fieldLabel,marginBottom:6}}>Block species:</label>
                          {Object.entries(sup.blockSpecies||{}).map(([spId,delivWeeks])=>{
                            const sp2=species.find(s=>s.id==parseInt(spId));
                            if(!sp2) return null;
                            const weeksInIncub=Math.round(((sp2.blockWeeks*7)-sp2.fruitDays)/7);
                            const remaining=Math.max(0,weeksInIncub*7-delivWeeks);
                            return(

                <div>
                  <label style={S.fieldLabel}>Type</label>

                  if(!newEntry.lossSpeciesId||!newEntry.lossQty||!newEntry.lossDate)return;

                  setLosses(p=>[...p,{
                    id:Date.now(), type:newEntry.lossType||"block",
                    speciesId:newEntry.lossSpeciesId, qty:lossQty,
                    inoculationDate:newEntry.lossDate, note:newEntry.lossNote||"",
                  }]);
                  if(newEntry.lossFromFruitingRoom){
                    const spId = newEntry.lossSpeciesId;
                    setFruitingRoom(prev=>{
                      let remaining = lossQty || 0;
                      if(!remaining) return prev;
                      const sorted = [...(prev||[])].sort((a,b)=>(a.loadDate||"").localeCompare(b.loadDate||""));
                      const next = [];
                      for(const e of sorted){
                        if(e.speciesId!==spId){ next.push(e); continue; }
                        if(remaining<=0){ next.push(e); continue; }
                        const q = parseFloat(e.qty)||0;
                        if(q<=remaining){
                          remaining = r2(remaining - q);
                          continue; // drop entry
                        }
                        next.push({...e, qty:r2(q-remaining)});
                        remaining = 0;
                      }
                      return next;
                    });
                  }
                  setNewEntry(p=>({...p,lossQty:"",lossNote:"",lossSpeciesId:""}));
                }} style={{...S.btn("#7a2a2a"),marginTop:16}}>+ Log Loss</button>

                        <button onClick={()=>setLosses(p=>p.filter(x=>x.id!==l.id))} style={{...S.btn("#5a2a2a"),padding:"2px 6px",fontSize:10,marginLeft:"auto"}}>✕</button>

            {/* ── SUBSTITUTIONS ────────────────────────────────────────────── */}
            <div style={{...S.card,borderLeft:"4px solid #f4d06f"}}>
              <h3 style={{margin:"0 0 8px",color:"#f4d06f",fontSize:13}}>🔄 Block Substitutions</h3>
              <p style={{margin:"0 0 10px",fontSize:11,color:"#5a8a5a"}}>When you grow one species to cover another's demand — affects Tasks coverage only, Bank stays accurate.</p>
              {/* Add new substitution */}

                <div>
                  <label style={S.fieldLabel}>From species</label>

                    {species.map(sp=><option key={sp.id} value={sp.id}>{sp.name}</option>)}
                  </select>
                </div>
                <div>
                  <label style={S.fieldLabel}>Covering for</label>
                  <select value={newEntry.subToId||""} onChange={e=>setNewEntry(p=>({...p,subToId:parseInt(e.target.value)||""}))} style={S.inp}>
                    <option value="">— pick —</option>

                </div>

                  if(!newEntry.subFromId||!newEntry.subToId||!newEntry.subQty) return;
                  const batch = getNextSubBatch(newEntry.subFromId);
                  const qty = Math.min(parseFloat(newEntry.subQty)||0, batch?.available||999);
                  if(qty<=0) return;
                  const date = batch?.batch?.date || todayStr();
                  if(!window.confirm(`Substitute ${qty} blocks of ${species.find(s=>s.id===newEntry.subFromId)?.name} → covering ${species.find(s=>s.id===newEntry.subToId)?.name}?\n\nThis affects Tasks only — Bank stays accurate.`)) return;
                  addSubstitution(newEntry.subFromId, newEntry.subToId, batch?.batch?.id||Date.now(), qty, date);
                  setNewEntry(p=>({...p,subFromId:"",subToId:"",subQty:""}));
                }} style={{...S.btn("#3a6a1a"),border:"1px solid #7ec8a0",padding:"6px 12px"}}>+ Add</button>
              </div>
              {/* Active substitutions list */}
              {substitutions.length>0&&(
                <div style={{borderTop:"1px solid #2d4a2d",paddingTop:8,marginTop:4}}>
                  {substitutions.map(sub=>{

                    const toSp = species.find(s=>s.id===sub.toSpeciesId);
                    return(
                      <div key={sub.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:5,fontSize:11,flexWrap:"wrap"}}>
                        <span style={{color:fromSp?.color||"#d4e8c2"}}>{fromSp?.name||"?"}</span>
                        <span style={{color:"#5a8a5a"}}>→</span>
                        <span style={{color:toSp?.color||"#d4e8c2"}}>{toSp?.name||"?"}</span>
                        <span style={{color:"#a78bda",flex:1}}>{sub.qty} blocks · {sub.date}</span>
                        <button onClick={()=>removeSubstitution(sub.id)}
                          style={{...S.btn("#5a2a2a"),padding:"1px 6px",fontSize:10}}>✕</button>
                      </div>
                    );
                  })}
                  <button onClick={()=>clearSubstitutions()} style={{...S.btn("#5a2a2a"),fontSize:11,marginTop:4}}>Clear All</button>
                </div>
              )}
              {substitutions.length===0&&<p style={{fontSize:11,color:"#3a5a3a",margin:0}}>No active substitutions.</p>}
            </div>

            {/* ── RETAKE INVENTORY ─────────────────────────────────────────── */}
            {["block","spawn"].map(type=>{
              const label = type==="block"?"🧱 Retake Block Inventory":"🌾 Retake Spawn Bag Inventory";
              const color = type==="block"?"#a78bda":"#e8a87c";
              const isOpen = retakeInv.show && retakeInv.type===type;
              return(
                <div key={type} style={{...S.card,borderLeft:`3px solid ${color}`}}>

                        <p style={{margin:"2px 0 0",fontSize:10,color:"#5a8a5a"}}>

                    </div>
                    <button onClick={()=>setRetakeInv(isOpen?{show:false,type,selected:{}}:{show:true,type,selected:{}})}
                      style={{...S.btn(isOpen?"#3a2a2a":"#1a2e1a"),fontSize:11,border:`1px solid ${color}`}}>
                      {isOpen?"Cancel":"Start Retake"}

                      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
                        <button onClick={()=>{
                          const all={};
                          species.forEach(sp=>{all[sp.id]=true;});
                          setRetakeInv(p=>({...p,selected:all}));
                        }} style={{...S.btn("#1a3a1a"),fontSize:11,border:"1px solid #3a6a3a"}}>✓ Select All</button>
                        <button onClick={()=>setRetakeInv(p=>({...p,selected:{}}))}
                          style={{...S.btn("#2a2a2a"),fontSize:11}}>Clear All</button>
                      </div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
                        {species.map(sp=>{
                          const sel = retakeInv.selected[sp.id];
                          return(
                            <button key={sp.id} onClick={()=>setRetakeInv(p=>({...p,selected:{...p.selected,[sp.id]:!p.selected[sp.id]}}))}
                              style={{...S.btn(sel?"#1a3a1a":"#1a2e1a"),border:`1px solid ${sel?sp.color:"#2d4a2d"}`,color:sel?sp.color:"#5a8a5a",fontSize:11,padding:"4px 10px"}}>
                              {sel?"✓ ":""}{sp.name}
                            </button>
                          );
                        })}
                      </div>
                      <button onClick={()=>{
                        const selectedIds = Object.keys(retakeInv.selected).filter(id=>retakeInv.selected[id]).map(Number);
                        if(selectedIds.length===0){alert("Select at least one species.");return;}
                        const spNames = selectedIds.map(id=>species.find(s=>s.id===id)?.name).filter(Boolean).join(", ");
                        if(!window.confirm(`Clear ALL ${type==="block"?"block":"spawn bag"} inventory for: ${spNames}?\n\nAll entries will be removed. Re-log your actual inventory with the correct bag dates.\n\nAre you sure?`)) return;

                          const spId = e.speciesId||e.sid;
                          if(!selectedIds.includes(spId)) return true;
                          if(e.type!==type) return true;
                          if(e.entryClass==='consumed') return true;
                          // Clear ALL entries for this species/type — user will re-log with correct dates
                          return false;
                        }));
                        const allSelected = selectedIds.length === species.length;
                        setLastInventory(p=>({...p,[type]:{
                          date: todayStr(),
                          allSpecies: allSelected,
                          speciesNames: allSelected ? null : selectedIds.map(id=>species.find(s=>s.id===id)?.name).filter(Boolean)
                        }}));

            {/* ── INVENTORY DISPLAY ────────────────────────────────────────── */}
            {["spawn","block"].map(type=>{

              const typeLabel=type==="spawn"?"🌾 Spawn Bags":"🧱 Blocks";

              // Group by date, merge same species+date
              const grouped = {};
              tracker.filter(e=>e.type===type&&e.entryClass!=='consumed').forEach(e=>{
                const sp=species.find(s=>s.id===e.speciesId||s.id===e.sid);
                if(!sp) return;
                const key=`${e.date}__${sp.id}`;
                if(!grouped[key]) grouped[key]={date:e.date,sp,qty:0,ids:[],note:e.note||""};
                grouped[key].qty=r2(grouped[key].qty+(parseFloat(e.qty)||0));
                grouped[key].ids.push(e.id);
              });

              // Sort by date (oldest first)
              const rows = Object.values(grouped).sort((a,b)=>a.date.localeCompare(b.date));

              return(
                <div key={type} style={S.card}>
                  <h3 style={{margin:"0 0 10px",color,fontSize:13}}>{typeLabel}</h3>

                    <div>
                      {/* Group by date */}

                        const byDate={};
                        rows.forEach(r=>{if(!byDate[r.date])byDate[r.date]=[];byDate[r.date].push(r);});
                        return Object.entries(byDate)
                          .sort(([a],[b])=>a.localeCompare(b))
                          .map(([date,dateRows])=>(
                          <div key={date} style={{marginBottom:10}}>
                            <p style={{margin:"0 0 5px",fontSize:11,color:"#5a8a5a",fontWeight:"bold",borderBottom:"1px solid #1a2e1a",paddingBottom:3}}>{date}</p>
                            {dateRows.map((row,ri)=>{
                              const editKey=`${type}_${date}_${row.sp.id}`;
                              const isEditing=expandedPriceClient===editKey;
                              const tw=thisWeek.find(s=>s.id===row.sp.id);
                              const rate=type==="spawn"?tw?.weeklySpawnBags:tw?.weeklyBlocks;
                              const td=rate?Math.round((row.qty/rate)*7):null;
                              const nd=new Date(row.date+'T12:00:00');if(td)nd.setDate(nd.getDate()+td);
                              const today=new Date();today.setHours(0,0,0,0);
                              const diff=td?Math.ceil((nd-today)/86400000):null;
                              const cc=diff===null?"#5a8a5a":diff<=7?"#f4d06f":"#7ec8a0";
                              const ct=diff===null?"—":diff<=0?"Due soon":`${Math.floor(diff/7)}w ${diff%7}d`;
                              return(
                                <div key={editKey} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:ri<dateRows.length-1?"1px solid #111e11":"none",flexWrap:"wrap"}}>
                                  <span style={{color:row.sp.color,fontWeight:"bold",fontSize:12,minWidth:60}}>{row.sp.name}</span>
                                  {isEditing?(
                                    <input type="number" min="0" step="0.5" autoFocus
                                      defaultValue={row.qty}
                                      onBlur={e=>{
                                        const newQty=parseFloat(e.target.value)||0;
                                        if(newQty===0){
                                          if(window.confirm("Set to 0? This will remove all entries for this batch."))
                                            setTracker(p=>p.filter(t=>!row.ids.includes(t.id)));
                                        } else {
                                          // Update first entry qty, remove rest
                                          setTracker(p=>{
                                            const updated=p.map(t=>row.ids[0]===t.id?{...t,qty:newQty}:t);
