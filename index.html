                      <label style={{fontSize:10,color:sp.color,display:"block",marginBottom:2}}>{sp.name}</label>
                      <input type="number" min="0" step="0.25" value={nc.lastWeekOrders?.[sp.id]||""}
                        onChange={e=>{const num=e.target.value===""?undefined:parseFloat(e.target.value)||0;setNc(p=>({...p,lastWeekOrders:{...p.lastWeekOrders,[sp.id]:num}}));}}
                        placeholder="—" style={S.numInp}/>
                    </div>
                  ))}
                </div>
                {showClientQuote==="setup" && ClientQuotePanel}
                <button onClick={()=>{
                  if(!nc.name.trim())return;
                  const startOffset = dateToDayOffset(nc.startDate||todayStr());
                  if(startOffset > 5) {
                    // Add as upcoming client
                    setUpcoming(p=>[...p,{id:Date.now(),type:"client",name:nc.name.trim(),startDate:nc.startDate||todayStr(),endDate:"",readyDaysBefore:0,orders:nc.orders||{}}]);
                  } else {
                    // Add directly to clients
                    const newId = Date.now();
                    setClients(p=>[...p,{id:newId,name:nc.name.trim()}]);
                    // Add their orders
                    if(nc.orders) {
                      const newOrders = {...orders};
                      newOrders[newId] = {};
                      Object.entries(nc.orders).forEach(([sid,lbs])=>{ if(lbs) newOrders[newId][parseInt(sid)] = lbs; });
                      setOrders(newOrders);
                    }
                  }
                  addClient(nc.name, nc.startDate, nc.orders, nc.clientType, nc.lastWeekOrders);
                  setNc({name:"", startDate:todayStr(), orders:{}, lastWeekOrders:{}, clientType:"restaurant"});
                }} style={{...S.btn(),marginTop:8}}>+ Add Client</button>
              </div>

              {/* Backup & Restore */}
              <div style={S.card}>
                <h4 style={{margin:"0 0 6px",color:"#7ec8a0",fontSize:12}}>💾 Backup & Restore</h4>
                <p style={{margin:"0 0 10px",fontSize:11,color:"#5a8a5a"}}>Save all your data to a file. Load it back anytime to restore — including on future versions of the app.</p>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <button onClick={()=>{
                    const backup = {
                      version: 1,
                      savedAt: new Date().toISOString(),
                      appName: "MushroomFarmPlanner",
                      data: {
                        species, clients, orders, seasonal, tracker,
                        losses, upcoming, schedule, orderHistory,
                        lastSubmittedWeek, menuChanges, suppliers,
                        substitutions,
                        fruitLoaded: JSON.parse(_ls.getItem('mfp_fruitLoaded')||'{}'),
                      }
                    };
                    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const dateStr = new Date().toISOString().slice(0,10);
                    a.href = url;
                    a.download = `mushroom-farm-backup-${dateStr}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                  }} style={{...S.btn("#1a3a5a"),border:"1px solid #3a6a9a",flex:1}}>💾 Save Backup</button>

                  <button onClick={()=>{
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'application/json,.json,*/*';
                    input.onchange = (e)=>{
                      const file = e.target.files[0];
                      if(!file) return;
                      const reader = new FileReader();
                      reader.onload = (ev)=>{
                        try {
                          const backup = JSON.parse(ev.target.result);
                          if(backup.appName !== "MushroomFarmPlanner") {
                            alert("This doesn't look like a Mushroom Farm Planner backup file.");
                            return;
                          }
                          if(!window.confirm(`Restore backup from ${backup.savedAt?.slice(0,10)||'unknown date'}?\n\nThis will replace all current data.`)) return;
                          const d = backup.data;
                          if(d.species)    setSpecies(d.species);
                          if(d.clients)    setClients(d.clients);
                          if(d.orders)     setOrders(d.orders);
                          if(d.seasonal)   setSeasonal(d.seasonal);
                          if(d.tracker)    setTracker(d.tracker);
                          if(d.losses)     setLosses(d.losses);
                          if(d.upcoming)   setUpcoming(d.upcoming);
                          if(d.schedule)   setSchedule(d.schedule);
                          if(d.orderHistory)     setOrderHistory(d.orderHistory);
                          if(d.lastSubmittedWeek!==undefined) setLastSubmittedWeek(d.lastSubmittedWeek);
                          if(d.menuChanges)      setMenuChanges(d.menuChanges);
                          if(d.suppliers)        setSuppliers(d.suppliers);
                          if(d.substitutions)    setSubstitutions(d.substitutions);
                          else                   setSubstitutions([]);
                          if(d.fruitLoaded)      { try{_ls.setItem('mfp_fruitLoaded',JSON.stringify(d.fruitLoaded));}catch(e){} }
                          alert("✅ Backup restored successfully!");
                        } catch(err) {
                          alert("Failed to read backup file. Make sure it's a valid Mushroom Farm Planner backup.");
                        }
                      };
                      reader.readAsText(file);
                    };
                    input.click();
                  }} style={{...S.btn("#1a3a1a"),border:"1px solid #3a6a3a",flex:1}}>📂 Load Backup</button>
                </div>
              </div>

              <div style={S.card}>
                <h4 style={{margin:"0 0 6px",color:"#e07b8a",fontSize:12}}>⚠️ Reset All Data</h4>
                <p style={{margin:"0 0 8px",fontSize:11,color:"#5a8a5a"}}>Clears all orders, inventory, and upcoming items.</p>
                {resetSnapshot&&(
                  <div style={{...S.box("#1a3a1a"),marginBottom:8,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                    <span style={{fontSize:12,color:"#7ec8a0"}}>⚠️ Data was reset.</span>
                    <button onClick={()=>{
                      setOrders(resetSnapshot.orders);
                      setTracker(resetSnapshot.tracker);
                      setLosses(resetSnapshot.losses);
                      setUpcoming(resetSnapshot.upcoming);
                      setSchedule(resetSnapshot.schedule);
                      setClients(resetSnapshot.clients);
                      setOrderHistory(resetSnapshot.orderHistory);
                      setLastSubmittedWeek(resetSnapshot.lastSubmittedWeek);
                      setMenuChanges(resetSnapshot.menuChanges);
                      setResetSnapshot(null);
                    }} style={{...S.btn("#1a4a1a"),border:"1px solid #7ec8a0",fontWeight:"bold"}}>↩ Undo Reset</button>
                    <button onClick={()=>setResetSnapshot(null)} style={{...S.btn("#3a2a2a"),fontSize:11}}>Dismiss</button>
                  </div>
                )}
                <button onClick={()=>{
                  if(window.confirm("⚠️ WARNING: This will permanently delete ALL your clients, orders, inventory, order history, and losses.\n\nThis cannot be undone. You will have to re-enter everything from scratch.\n\nAre you absolutely sure?")) {
                    if(window.confirm("Last chance — are you 100% sure you want to delete everything?")) {
                      // Save snapshot for undo
                      setResetSnapshot({
                        orders, tracker, losses, upcoming, schedule,
                        clients, orderHistory, lastSubmittedWeek, menuChanges
                      });
                      setOrders(DEFAULT_ORDERS);
                      setTracker([]);
                      setLosses([]);
                      setUpcoming([]);
                      setSchedule(DEFAULT_SCHEDULE);
                      setClients(DEFAULT_CLIENTS);
                      setOrderHistory({});
                      setLastSubmittedWeek(null);
                      setMenuChanges([]);
                      setSubstitutions([]);
                      _ls.removeItem('mfp_substitutions');
                    }
                  }
                }} style={S.btn("#5a2a2a")}>Reset Everything</button>
              </div>

              {/* Active Substitutions — view and remove only */}
              {substitutions.length>0&&(
              <div style={S.card}>
                <h3 style={{margin:"0 0 8px",color:"#f4d06f",fontSize:13}}>🔄 Active Substitutions</h3>
                {substitutions.map(sub=>{
                  const fromSp = species.find(s=>s.id===sub.fromSpeciesId);
                  const toSp = species.find(s=>s.id===sub.toSpeciesId);
                  return(
                    <div key={sub.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,fontSize:11,flexWrap:"wrap"}}>
                      <span style={{color:fromSp?.color||"#d4e8c2"}}>{fromSp?.name||"?"}</span>
                      <span style={{color:"#5a8a5a"}}>→</span>
                      <span style={{color:toSp?.color||"#d4e8c2"}}>{toSp?.name||"?"}</span>
                      <span style={{color:"#a78bda"}}>{sub.qty} blocks</span>
                      <span style={{color:"#5a8a5a"}}>{sub.date}</span>
                      <button onClick={()=>removeSubstitution(sub.id)}
                        style={{...S.btn("#5a2a2a"),padding:"1px 6px",fontSize:10}}>✕</button>
                    </div>
                  );
                })}
                <button onClick={()=>clearSubstitutions()}
                  style={{...S.btn("#5a2a2a"),marginTop:8,fontSize:11}}>Clear All</button>
              </div>
              )}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}



ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
